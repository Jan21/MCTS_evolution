# Depth-recurrent transformer. These are exactly the constructor kwargs
# (in_channels and num_classes are injected from the data / shared config).
d_model: 128
nhead: 4
dim_ff: 256
depth: 8            # weight-shared recurrence steps
dropout: 0.0
lr: 3e-4
weight_decay: 1e-4
pool: mean          # mean | cls
