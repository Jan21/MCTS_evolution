defaults:
  - data: default
  - model: drt
  - encoder: grid
  - trainer: default
  - _self_

# Shared knobs (referenced by sub-configs via interpolation).
seed: 0
num_classes: 50          # cost-to-go bins (data max ~49)
sigma: 1.0               # HL-Gauss smoothing width
data_path: nn/data/all.jsonl

hydra:
  job:
    chdir: false         # keep relative data_path working
  run:
    dir: train/outputs/${now:%Y-%m-%d_%H-%M-%S}
