<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Log Viewer</title>
<style>
  :root {
    --bg: #1e1e2e;
    --surface: #282840;
    --surface2: #313150;
    --text: #cdd6f4;
    --text-dim: #7f849c;
    --blue: #89b4fa;
    --green: #a6e3a1;
    --peach: #fab387;
    --red: #f38ba8;
    --mauve: #cba6f7;
    --teal: #94e2d5;
    --yellow: #f9e2af;
    --border: #45475a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  #drop-zone {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
    text-align: center;
  }
  #drop-zone.hidden { display: none; }
  .drop-box {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 60px 40px;
    max-width: 600px;
    width: 100%;
    transition: border-color 0.2s;
  }
  .drop-box.dragover { border-color: var(--blue); }
  .drop-box h1 { font-size: 24px; color: var(--blue); margin-bottom: 12px; }
  .drop-box p { color: var(--text-dim); margin-bottom: 20px; }
  .drop-box input[type=file] { display: none; }
  .drop-box label {
    display: inline-block;
    background: var(--surface2);
    color: var(--blue);
    padding: 10px 24px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .drop-box label:hover { background: var(--border); }

  #viewer { display: none; padding: 0; }
  #viewer.active { display: block; }

  /* Header bar */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header h2 { font-size: 16px; color: var(--blue); white-space: nowrap; }
  .header .stats { color: var(--text-dim); font-size: 12px; }
  .header .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
  }
  .filter-btn.active { color: var(--text); border-color: var(--blue); background: rgba(137,180,250,0.1); }
  .filter-btn:hover { border-color: var(--text-dim); }
  #back-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--peach);
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
  }

  /* Messages */
  .messages { padding: 16px 24px; max-width: 1200px; margin: 0 auto; }
  .msg {
    margin-bottom: 12px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .msg-header {
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .msg-header:hover { filter: brightness(1.1); }
  .msg-body {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    overflow-x: auto;
  }
  .msg-body.collapsed { display: none; }

  .msg.user .msg-header { background: rgba(137,180,250,0.08); }
  .msg.assistant .msg-header { background: rgba(166,227,161,0.08); }
  .msg.tool_use .msg-header { background: rgba(250,179,135,0.08); }
  .msg.tool_result .msg-header { background: rgba(203,166,247,0.08); }
  .msg.progress .msg-header { background: rgba(148,226,213,0.05); }
  .msg.system .msg-header { background: rgba(249,226,175,0.05); }

  .role-badge {
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
  }
  .msg.user .role-badge { background: rgba(137,180,250,0.2); color: var(--blue); }
  .msg.assistant .role-badge { background: rgba(166,227,161,0.2); color: var(--green); }
  .msg.tool_use .role-badge { background: rgba(250,179,135,0.2); color: var(--peach); }
  .msg.tool_result .role-badge { background: rgba(203,166,247,0.2); color: var(--mauve); }
  .msg.progress .role-badge { background: rgba(148,226,213,0.2); color: var(--teal); }
  .msg.system .role-badge { background: rgba(249,226,175,0.2); color: var(--yellow); }

  .msg-time { color: var(--text-dim); }
  .msg-meta { color: var(--text-dim); margin-left: auto; font-size: 11px; }
  .expand-icon { color: var(--text-dim); font-size: 10px; width: 12px; }

  /* Content styling */
  .text-content { white-space: pre-wrap; word-break: break-word; }
  .tool-name { color: var(--peach); font-weight: 600; }
  .tool-input {
    background: var(--surface2);
    padding: 8px 12px;
    border-radius: 4px;
    margin-top: 8px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
    max-height: 400px;
    overflow-y: auto;
  }
  .tool-result-content {
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
  }
  .truncated { color: var(--text-dim); font-style: italic; }

  /* JSON tree */
  .json-key { color: var(--blue); }
  .json-str { color: var(--green); }
  .json-num { color: var(--peach); }
  .json-bool { color: var(--mauve); }
  .json-null { color: var(--text-dim); }
</style>
</head>
<body>

<div id="drop-zone">
  <div class="drop-box" id="drop-box">
    <h1>Claude Code Log Viewer</h1>
    <p>Drop a .jsonl transcript file here, or click to browse.<br>
    <span style="font-size:12px; color: var(--text-dim)">
      Files are at ~/.claude/projects/&lt;project-path&gt;/*.jsonl
    </span></p>
    <label for="file-input">Choose File</label>
    <input type="file" id="file-input" accept=".jsonl,.json">
  </div>
</div>

<div id="viewer">
  <div class="header">
    <button id="back-btn">Back</button>
    <h2 id="session-title">Session</h2>
    <span class="stats" id="stats"></span>
    <div class="filters" id="filters"></div>
  </div>
  <div class="messages" id="messages"></div>
</div>

<script>
const dropZone = document.getElementById('drop-zone');
const dropBox = document.getElementById('drop-box');
const fileInput = document.getElementById('file-input');
const viewer = document.getElementById('viewer');
const messagesEl = document.getElementById('messages');
const statsEl = document.getElementById('stats');
const filtersEl = document.getElementById('filters');
const titleEl = document.getElementById('session-title');

// Drag and drop
dropBox.addEventListener('dragover', e => { e.preventDefault(); dropBox.classList.add('dragover'); });
dropBox.addEventListener('dragleave', () => dropBox.classList.remove('dragover'));
dropBox.addEventListener('drop', e => {
  e.preventDefault();
  dropBox.classList.remove('dragover');
  if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) loadFile(fileInput.files[0]); });
document.getElementById('back-btn').addEventListener('click', () => {
  viewer.classList.remove('active');
  dropZone.classList.remove('hidden');
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const lines = reader.result.split('\n').filter(l => l.trim());
    const entries = [];
    for (const line of lines) {
      try { entries.push(JSON.parse(line)); } catch {}
    }
    renderSession(file.name, entries);
  };
  reader.readAsText(file);
}

function classify(entry) {
  const type = entry.type;
  if (type === 'user' && entry.message) {
    const content = entry.message.content;
    if (Array.isArray(content) && content.some(c => c.type === 'tool_result')) return 'tool_result';
    return 'user';
  }
  if (type === 'assistant' && entry.message) {
    const content = entry.message.content;
    if (Array.isArray(content) && content.some(c => c.type === 'tool_use')) return 'tool_use';
    return 'assistant';
  }
  if (type === 'progress') return 'progress';
  if (type === 'queue-operation' || type === 'file-history-snapshot') return 'system';
  return 'system';
}

const LABELS = {
  user: 'User',
  assistant: 'Assistant',
  tool_use: 'Tool Call',
  tool_result: 'Tool Result',
  progress: 'Progress',
  system: 'System'
};

let allParsed = [];
let activeFilters = new Set(['user', 'assistant', 'tool_use', 'tool_result']);

function renderSession(filename, entries) {
  dropZone.classList.add('hidden');
  viewer.classList.add('active');

  const sessionId = entries.find(e => e.sessionId)?.sessionId || '';
  const slug = entries.find(e => e.slug)?.slug || '';
  titleEl.textContent = slug || sessionId.slice(0, 8) || filename;

  allParsed = entries.map(e => ({ entry: e, cls: classify(e) }));

  const counts = {};
  for (const { cls } of allParsed) counts[cls] = (counts[cls] || 0) + 1;

  statsEl.textContent = `${entries.length} entries`;

  // Build filter buttons
  filtersEl.innerHTML = '';
  for (const cls of ['user', 'assistant', 'tool_use', 'tool_result', 'progress', 'system']) {
    if (!counts[cls]) continue;
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (activeFilters.has(cls) ? ' active' : '');
    btn.textContent = `${LABELS[cls]} (${counts[cls]})`;
    btn.addEventListener('click', () => {
      if (activeFilters.has(cls)) activeFilters.delete(cls);
      else activeFilters.add(cls);
      btn.classList.toggle('active');
      renderMessages();
    });
    filtersEl.appendChild(btn);
  }

  renderMessages();
}

function renderMessages() {
  messagesEl.innerHTML = '';
  for (const { entry, cls } of allParsed) {
    if (!activeFilters.has(cls)) continue;
    messagesEl.appendChild(buildMessage(entry, cls));
  }
}

function truncate(str, max = 5000) {
  if (str.length <= max) return str;
  return str.slice(0, max) + '\n... [truncated, ' + str.length + ' chars total]';
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function buildMessage(entry, cls) {
  const div = document.createElement('div');
  div.className = `msg ${cls}`;

  const header = document.createElement('div');
  header.className = 'msg-header';

  const expand = document.createElement('span');
  expand.className = 'expand-icon';
  expand.textContent = '\u25B6';

  const badge = document.createElement('span');
  badge.className = 'role-badge';
  badge.textContent = LABELS[cls];

  const time = document.createElement('span');
  time.className = 'msg-time';
  const ts = entry.timestamp || entry.message?.created || '';
  if (ts) {
    try { time.textContent = new Date(ts).toLocaleTimeString(); } catch { time.textContent = ts; }
  }

  const meta = document.createElement('span');
  meta.className = 'msg-meta';
  meta.textContent = buildMeta(entry, cls);

  header.append(expand, badge, time, meta);

  const body = document.createElement('div');
  body.className = 'msg-body collapsed';
  body.innerHTML = buildBody(entry, cls);

  // Auto-expand user and assistant text messages
  const autoExpand = cls === 'user' || cls === 'assistant';
  if (autoExpand) {
    body.classList.remove('collapsed');
    expand.textContent = '\u25BC';
  }

  header.addEventListener('click', () => {
    body.classList.toggle('collapsed');
    expand.textContent = body.classList.contains('collapsed') ? '\u25B6' : '\u25BC';
  });

  div.append(header, body);
  return div;
}

function buildMeta(entry, cls) {
  if (cls === 'tool_use') {
    const content = entry.message?.content || [];
    const tools = content.filter(c => c.type === 'tool_use').map(c => c.name);
    return tools.join(', ');
  }
  if (cls === 'progress') {
    return entry.data?.hookName || entry.data?.type || '';
  }
  if (cls === 'system') {
    return entry.type || '';
  }
  if (cls === 'assistant') {
    return entry.message?.model || '';
  }
  return '';
}

function buildBody(entry, cls) {
  if (cls === 'user' || cls === 'assistant') {
    const content = entry.message?.content;
    if (!content) return '<span class="text-dim">empty</span>';
    if (typeof content === 'string') return `<div class="text-content">${escapeHtml(truncate(content))}</div>`;
    return content.map(block => {
      if (block.type === 'text') {
        return `<div class="text-content">${escapeHtml(truncate(block.text || ''))}</div>`;
      }
      if (block.type === 'tool_use') {
        const input = typeof block.input === 'string' ? block.input : JSON.stringify(block.input, null, 2);
        return `<div>
          <span class="tool-name">${escapeHtml(block.name || '?')}</span>
          <span style="color:var(--text-dim); font-size:11px; margin-left:8px">${escapeHtml(block.id || '')}</span>
          <div class="tool-input">${escapeHtml(truncate(input, 3000))}</div>
        </div>`;
      }
      if (block.type === 'tool_result') {
        const resultContent = block.content;
        let text = '';
        if (typeof resultContent === 'string') {
          text = resultContent;
        } else if (Array.isArray(resultContent)) {
          text = resultContent.map(r => r.text || JSON.stringify(r)).join('\n');
        } else {
          text = JSON.stringify(resultContent, null, 2);
        }
        return `<div>
          <span style="color:var(--text-dim); font-size:11px">Result for ${escapeHtml(block.tool_use_id || '?')}</span>
          ${block.is_error ? '<span style="color:var(--red); margin-left:8px">ERROR</span>' : ''}
          <div class="tool-result-content">${escapeHtml(truncate(text, 3000))}</div>
        </div>`;
      }
      return `<div class="tool-input">${escapeHtml(JSON.stringify(block, null, 2).slice(0, 500))}</div>`;
    }).join('<hr style="border-color:var(--border); margin:8px 0">');
  }
  if (cls === 'tool_use') {
    return buildBody(entry, 'assistant');
  }
  if (cls === 'tool_result') {
    return buildBody(entry, 'user');
  }
  if (cls === 'progress') {
    return `<div class="tool-input">${escapeHtml(JSON.stringify(entry.data || entry, null, 2).slice(0, 2000))}</div>`;
  }
  // system
  return `<div class="tool-input">${escapeHtml(JSON.stringify(entry, null, 2).slice(0, 2000))}</div>`;
}
</script>
</body>
</html>
