<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid Visualizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #1a1a1a; color: #eee; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    h1 { margin-bottom: 16px; font-size: 1.2rem; color: #aaa; }
    #controls { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
    button {
      padding: 8px 18px; border: 1px solid #555; background: #2a2a2a; color: #eee;
      cursor: pointer; border-radius: 4px; font-family: monospace; font-size: 0.9rem;
    }
    button:hover { background: #3a3a3a; }
    button:disabled { opacity: 0.4; cursor: default; }
    #step-info { color: #aaa; font-size: 0.9rem; min-width: 80px; text-align: center; }
    #canvas-container { position: relative; }
    canvas { border: 1px solid #444; background: white; display: block; }
    #status { margin-top: 10px; color: #888; font-size: 0.8rem; min-height: 1.2em; }
    #legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; justify-content: center; font-size: 0.8rem; color: #aaa; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #555; }
    .legend-swatch.square { border-radius: 2px; }
    input[type=file] { display: none; }
    label.file-btn {
      padding: 8px 18px; border: 1px solid #555; background: #2a2a2a; color: #eee;
      cursor: pointer; border-radius: 4px; font-size: 0.9rem;
    }
    label.file-btn:hover { background: #3a3a3a; }
  </style>
</head>
<body>
  <h1>Grid Visualizer</h1>
  <div id="controls">
    <label class="file-btn" for="file-input">Load JSON</label>
    <input type="file" id="file-input" accept=".json">
    <button id="btn-prev" disabled>&#8592; Prev</button>
    <span id="step-info">no data</span>
    <button id="btn-next" disabled>Next &#8594;</button>
  </div>
  <div id="canvas-container">
    <canvas id="canvas" width="640" height="640"></canvas>
  </div>
  <div id="status">Load a JSON file to begin.</div>
  <div id="legend"></div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const stepInfo = document.getElementById('step-info');
    const statusEl = document.getElementById('status');
    const legendEl = document.getElementById('legend');

    let data = null;
    let steps = [];
    let currentStep = 0;

    const DEFAULT_SETTINGS = {
      grid_lines_width: 1,
      wall_width: 3,
      grid_square_color: 'white',
      wall_color: 'black',
      coordinates_shown: true,
      target_color: 'red',
      robot_radius: 0.3,
      final_component_color: 'lightblue',
    };

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          loadData(parsed);
          statusEl.textContent = `Loaded: ${file.name}`;
        } catch (err) {
          statusEl.textContent = `Error parsing JSON: ${err.message}`;
        }
      };
      reader.readAsText(file);
    });

    function loadData(parsed) {
      data = parsed;
      // Collect numeric step keys, sorted
      steps = Object.keys(parsed)
        .filter(k => !isNaN(parseInt(k)))
        .sort((a, b) => parseInt(a) - parseInt(b));
      currentStep = 0;
      updateButtons();
      renderStep();
      updateLegend();
    }

    function getSettings() {
      return Object.assign({}, DEFAULT_SETTINGS, (data && data.settings) || {});
    }

    function updateButtons() {
      const n = steps.length;
      btnPrev.disabled = currentStep <= 0;
      btnNext.disabled = currentStep >= n - 1;
      if (n === 0) {
        stepInfo.textContent = 'no data';
      } else {
        stepInfo.textContent = `Step ${currentStep + 1} / ${n}`;
      }
    }

    btnPrev.addEventListener('click', () => {
      if (currentStep > 0) { currentStep--; updateButtons(); renderStep(); }
    });
    btnNext.addEventListener('click', () => {
      if (currentStep < steps.length - 1) { currentStep++; updateButtons(); renderStep(); }
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') btnPrev.click();
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') btnNext.click();
    });

    function renderStep() {
      if (!data || steps.length === 0) return;
      const key = steps[currentStep];
      const step = data[key];
      if (!step) return;

      const settings = getSettings();

      // grid_size: [width, height] = [cols, rows] in x,y terms
      const [cols, rows] = step.grid_size || [16, 16];

      // Canvas sizing: leave margin for coords + padding around edges
      const coordMargin = settings.coordinates_shown ? 22 : 0;
      const edgePadding = 16;
      const canvasSize = 640;
      const gridW = canvasSize - coordMargin - 2 * edgePadding;
      const gridH = canvasSize - coordMargin - 2 * edgePadding;
      const cellW = gridW / cols;
      const cellH = gridH / rows;

      canvas.width = canvasSize;
      canvas.height = canvasSize;

      const offsetX = coordMargin + edgePadding;
      const offsetY = edgePadding;

      // Helper: cell top-left pixel (row, col)
      const cx = (col) => offsetX + col * cellW;
      const cy = (row) => offsetY + row * cellH;
      // Cell center pixel
      const ccx = (col) => offsetX + (col + 0.5) * cellW;
      const ccy = (row) => offsetY + (row + 0.5) * cellH;

      // --- Background ---
      ctx.fillStyle = settings.grid_square_color;
      ctx.fillRect(offsetX, offsetY, gridW, gridH);

      // --- Final components ---
      // positions are (col, row): [0]=col=x, [1]=row=y
      const finalComponents = (step.final_components || []).map(normalizePos);
      for (const [c, r] of finalComponents) {
        ctx.fillStyle = settings.final_component_color;
        ctx.fillRect(cx(c), cy(r), cellW, cellH);
      }

      // --- Target cell ---
      const target = normalizePos(step.target);
      if (target) {
        const [tc, tr] = target;  // tc=col=x, tr=row=y
        ctx.fillStyle = hexWithAlpha(settings.target_color, 0.25);
        ctx.fillRect(cx(tc), cy(tr), cellW, cellH);
        // Draw target crosshair
        ctx.strokeStyle = settings.target_color;
        ctx.lineWidth = 2;
        const margin = cellW * 0.15;
        ctx.strokeRect(cx(tc) + margin, cy(tr) + margin, cellW - 2*margin, cellH - 2*margin);
        // Circle in center
        ctx.beginPath();
        ctx.arc(ccx(tc), ccy(tr), Math.min(cellW, cellH) * 0.18, 0, Math.PI * 2);
        ctx.strokeStyle = settings.target_color;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // --- Grid lines ---
      ctx.strokeStyle = '#ccc';
      ctx.lineWidth = settings.grid_lines_width;
      for (let r = 0; r <= rows; r++) {
        ctx.beginPath();
        ctx.moveTo(offsetX, cy(r));
        ctx.lineTo(offsetX + gridW, cy(r));
        ctx.stroke();
      }
      for (let c = 0; c <= cols; c++) {
        ctx.beginPath();
        ctx.moveTo(cx(c), offsetY);
        ctx.lineTo(cx(c), offsetY + gridH);
        ctx.stroke();
      }

      // --- Outer border ---
      ctx.strokeStyle = settings.wall_color;
      ctx.lineWidth = settings.wall_width;
      ctx.strokeRect(offsetX, offsetY, gridW, gridH);

      // --- Walls (drawn after grid lines so they render on top) ---
      // step.walls: array of [col, row, sides] where sides is a string of N/S/E/W characters
      // e.g. [4, 0, "SE"] draws walls on the south and east sides of cell at col=4, row=0
      if (step.walls) {
        ctx.strokeStyle = settings.wall_color;
        ctx.lineWidth = settings.wall_width;
        ctx.lineCap = 'square';
        for (const wall of step.walls) {
          const [wc, wr, sides] = wall;  // wc=col=x, wr=row=y
          const s = (sides || '').toUpperCase();
          if (s.includes('N')) { ctx.beginPath(); ctx.moveTo(cx(wc), cy(wr));     ctx.lineTo(cx(wc+1), cy(wr));     ctx.stroke(); }
          if (s.includes('S')) { ctx.beginPath(); ctx.moveTo(cx(wc), cy(wr+1));   ctx.lineTo(cx(wc+1), cy(wr+1));   ctx.stroke(); }
          if (s.includes('E')) { ctx.beginPath(); ctx.moveTo(cx(wc+1), cy(wr));   ctx.lineTo(cx(wc+1), cy(wr+1));   ctx.stroke(); }
          if (s.includes('W')) { ctx.beginPath(); ctx.moveTo(cx(wc), cy(wr));     ctx.lineTo(cx(wc), cy(wr+1));     ctx.stroke(); }
        }
      }

      // --- Coordinates ---
      // col (x-axis) labels across the bottom, row (y-axis) labels down the left
      if (settings.coordinates_shown) {
        ctx.fillStyle = '#666';
        ctx.font = `${Math.max(8, Math.min(11, cellW * 0.45))}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let c = 0; c < cols; c++) {
          ctx.fillText(c, ccx(c), offsetY + gridH + coordMargin / 2);  // col numbers across bottom
        }
        for (let r = 0; r < rows; r++) {
          ctx.fillText(r, edgePadding + coordMargin / 2, ccy(r));  // row numbers down left
        }
      }

      // --- Robots ---
      const robots = [];
      if (step.target_robot) {
        robots.push(normalizeRobot(step.target_robot));
      }
      for (const h of (step.helper_robots || step.helpers || [])) {
        robots.push(normalizeRobot(h));
      }

      for (const robot of robots) {
        const [rc, rr] = robot.position;  // rc=col=x, rr=row=y
        const radius = Math.min(cellW, cellH) * settings.robot_radius;
        const px = ccx(rc), py = ccy(rr);

        // Shadow
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 4;

        // Body
        ctx.beginPath();
        ctx.arc(px, py, radius, 0, Math.PI * 2);
        ctx.fillStyle = robot.color;
        ctx.fill();

        ctx.shadowBlur = 0;

        // Outline
        ctx.beginPath();
        ctx.arc(px, py, radius, 0, Math.PI * 2);
        ctx.strokeStyle = darken(robot.color, 0.4);
        ctx.lineWidth = Math.max(1.5, radius * 0.12);
        ctx.stroke();

        // Highlight
        ctx.beginPath();
        ctx.arc(px - radius * 0.28, py - radius * 0.28, radius * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fill();
      }

      // --- Target robot marker on target (star/arrow if not already there) ---
      // Draw a small label "T" on target robot
      if (step.target_robot) {
        const robot = normalizeRobot(step.target_robot);
        const [rc, rr] = robot.position;  // rc=col=x, rr=row=y
        const radius = Math.min(cellW, cellH) * settings.robot_radius;
        ctx.font = `bold ${Math.max(9, radius * 0.7)}px monospace`;
        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('T', ccx(rc), ccy(rr));
      }

      // --- Bottleneck-support pairs ---
      // support both old hyphenated key and new underscore key (Python kwargs can't use hyphens)
      const bsPairs = step['bottleneck_support_pairs'] || step['bottleneck-support_pairs'] || [];
      const bsColors = ['#e6550d', '#31a354', '#3182bd', '#756bb1', '#e7298a', '#66a61e'];
      for (let i = 0; i < bsPairs.length; i++) {
        const pair = bsPairs[i];
        const bn = normalizePos(pair.bottleneck);
        const sp = normalizePos(pair.support);
        if (!bn || !sp) continue;
        const color = bsColors[i % bsColors.length];

        // Draw line connecting bottleneck to support
        ctx.beginPath();
        ctx.moveTo(ccx(bn[0]), ccy(bn[1]));
        ctx.lineTo(ccx(sp[0]), ccy(sp[1]));
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 3]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw bottleneck as diamond
        const dSize = Math.min(cellW, cellH) * 0.22;
        const bx = ccx(bn[0]), by = ccy(bn[1]);
        ctx.beginPath();
        ctx.moveTo(bx, by - dSize);
        ctx.lineTo(bx + dSize, by);
        ctx.lineTo(bx, by + dSize);
        ctx.lineTo(bx - dSize, by);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = darken(color, 0.3);
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // Label "B"
        ctx.font = `bold ${Math.max(7, dSize * 0.8)}px monospace`;
        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('B', bx, by);

        // Draw support as small square
        const sSize = Math.min(cellW, cellH) * 0.18;
        const sx = ccx(sp[0]), sy = ccy(sp[1]);
        ctx.fillStyle = color;
        ctx.fillRect(sx - sSize, sy - sSize, sSize * 2, sSize * 2);
        ctx.strokeStyle = darken(color, 0.3);
        ctx.lineWidth = 1.5;
        ctx.strokeRect(sx - sSize, sy - sSize, sSize * 2, sSize * 2);
        // Label "S"
        ctx.font = `bold ${Math.max(7, sSize * 0.8)}px monospace`;
        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('S', sx, sy);
      }
    }

    function normalizePos(pos) {
      if (!pos) return null;
      if (Array.isArray(pos)) return [pos[0], pos[1]];
      if (typeof pos === 'object') return [pos.x ?? pos.col ?? pos[0], pos.y ?? pos.row ?? pos[1]];
      return null;
    }

    function normalizeRobot(r) {
      if (!r) return null;
      const position = normalizePos(r.position || r.pos || r);
      return { position, color: r.color || 'gray' };
    }

    function hexWithAlpha(color, alpha) {
      // Returns rgba for named or hex colors
      const tmp = document.createElement('canvas');
      tmp.width = tmp.height = 1;
      const c = tmp.getContext('2d');
      c.fillStyle = color;
      c.fillRect(0, 0, 1, 1);
      const d = c.getImageData(0, 0, 1, 1).data;
      return `rgba(${d[0]},${d[1]},${d[2]},${alpha})`;
    }

    function darken(color, amount) {
      const tmp = document.createElement('canvas');
      tmp.width = tmp.height = 1;
      const c = tmp.getContext('2d');
      c.fillStyle = color;
      c.fillRect(0, 0, 1, 1);
      const d = c.getImageData(0, 0, 1, 1).data;
      return `rgb(${Math.floor(d[0]*(1-amount))},${Math.floor(d[1]*(1-amount))},${Math.floor(d[2]*(1-amount))})`;
    }

    function updateLegend() {
      if (!data) { legendEl.innerHTML = ''; return; }
      const settings = getSettings();
      legendEl.innerHTML = `
        <div class="legend-item"><div class="legend-swatch square" style="background:${settings.final_component_color}"></div>Final component</div>
        <div class="legend-item"><div class="legend-swatch square" style="background:${hexWithAlpha(settings.target_color, 0.25)};border-color:${settings.target_color}"></div>Target cell</div>
        <div class="legend-item"><div class="legend-swatch" style="background:gray"></div>Helper robot</div>
        <div class="legend-item"><div class="legend-swatch" style="background:gray;color:white;font-size:9px;display:flex;align-items:center;justify-content:center">T</div>Target robot</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#e6550d;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);border:none"></div>Bottleneck</div>
        <div class="legend-item"><div class="legend-swatch square" style="background:#e6550d"></div>Support</div>
      `;
    }

    // Draw empty grid placeholder
    (function initCanvas() {
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#aaa';
      ctx.font = '16px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Load a JSON file to visualize', canvas.width/2, canvas.height/2);
    })();
  </script>
</body>
</html>
