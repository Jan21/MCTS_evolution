<figure class="fig figc-descent">
<style>
.figc-descent .ttl{font-size:14px;font-weight:600;color:var(--fg);margin:0 0 3px}
.figc-descent .hint{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.45}
.figc-descent text{font-size:13px}
.figc-descent text.hd{font-weight:600}
.figc-descent text.sm{font-size:12px}
</style>

<div class="ttl">How a label is made &mdash; and when it is thrown away</div>
<div class="hint">Every label is checked by actually playing the moves out. Anything that cannot be played is dropped rather than guessed at, so a wrong answer never reaches the training data.</div>

<svg viewBox="0 0 900 290" role="img" aria-label="A flow: a candidate next step goes to the network, which quickly finishes the plan; every move is then replayed under real game physics. If it plays out it becomes a label with the moves counted; if it fails it is thrown away.">
  <defs>
    <marker id="deArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.6 L9.4,5 L0,9.4 Z" fill="var(--muted)" />
    </marker>
  </defs>

  <!-- boxes -->
  <g fill="var(--card)" stroke="var(--line)" stroke-width="1.5">
    <rect x="16" y="110" width="160" height="68" rx="10" />
    <rect x="202" y="110" width="188" height="68" rx="10" />
    <rect x="416" y="110" width="204" height="68" rx="10" />
    <rect x="676" y="40" width="208" height="84" rx="10" />
    <rect x="676" y="176" width="208" height="84" rx="10" />
  </g>

  <!-- connectors -->
  <g fill="none" stroke="var(--muted)" stroke-width="2">
    <path d="M176,144 L192,144" marker-end="url(#deArrow)" />
    <path d="M390,144 L406,144" marker-end="url(#deArrow)" />
    <path d="M620,144 L646,144" />
    <path d="M646,82 L646,218" />
    <path d="M646,82 L666,82" marker-end="url(#deArrow)" />
    <path d="M646,218 L666,218" marker-end="url(#deArrow)" />
  </g>

  <!-- box text -->
  <g fill="var(--fg)" text-anchor="middle">
    <text x="96" y="138" class="hd">candidate</text>
    <text x="96" y="158">next step</text>
    <text x="296" y="138" class="hd">network quickly</text>
    <text x="296" y="158">finishes the plan</text>
    <text x="518" y="138" class="hd">replay every move</text>
    <text x="518" y="158">under real game physics</text>
  </g>

  <!-- outcome: kept -->
  <circle cx="700" cy="82" r="11" fill="var(--accent)" />
  <path d="M694.5,82.2 L698.4,86.4 L706,77.6" fill="none" stroke="var(--bg)" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" />
  <text x="722" y="66" class="hd" fill="var(--fg)">plays out</text>
  <text x="722" y="86" fill="var(--fg)">becomes a label</text>
  <text x="722" y="106" class="sm" fill="var(--muted)">moves counted</text>

  <!-- outcome: dropped -->
  <circle cx="700" cy="218" r="11" fill="var(--s2)" />
  <path d="M695.6,213.6 L704.4,222.4 M704.4,213.6 L695.6,222.4" fill="none" stroke="var(--bg)"
        stroke-width="2.5" stroke-linecap="round" />
  <text x="722" y="202" class="hd" fill="var(--fg)">fails to play out</text>
  <text x="722" y="222" fill="var(--fg)">thrown away</text>
  <text x="722" y="242" class="sm" fill="var(--muted)">never mislabeled</text>
</svg>
</figure>
