<figure class="fig figc-curve">
<style>
.figc-curve .ttl{font-size:14px;font-weight:600;color:var(--fg);margin:0 0 3px}
.figc-curve .hint{font-size:12.5px;color:var(--muted);margin:0 0 8px;line-height:1.45}
.figc-curve .lg{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:0 0 6px;font-size:12.5px;color:var(--muted)}
.figc-curve .lg em{font-style:normal;display:inline-flex;align-items:center;gap:7px}
.figc-curve .k{width:14px;height:3px;border-radius:2px;display:inline-block}
.figc-curve .cv-wrap{position:relative}
.figc-curve text{font-size:12px}
.figc-curve g.el text{font-size:13px;font-weight:600}
.figc-curve .cv-hit{outline:none;cursor:crosshair}
.figc-curve .cv-tip{position:absolute;display:none;transform:translate(-50%,-100%);
  background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 9px;
  font-size:12px;line-height:1.5;color:var(--muted);pointer-events:none;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.figc-curve .cv-tip.on{display:block}
.figc-curve .cv-tip.below{transform:translate(-50%,0)}
.figc-curve .cv-v{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.figc-curve .cv-x{display:none}
.figc-curve .cv-x.on{display:block}
</style>

<div class="hint">The network only ever saw 8 &times; 8 and 10 &times; 10 boards while learning. Everything to the right of the shaded strip is a size it had never seen. Lower is better; hover a point for the exact figures.</div>

<script>
(function(){
  var root=document.querySelector('.figc-curve');
  if(!root) return;
  var svg=root.querySelector('svg'), wrap=root.querySelector('.cv-wrap'),
      tip=root.querySelector('.cv-tip'), ring=root.querySelector('#cvRing'),
      tv=tip.querySelector('.cv-v'), ts=tip.querySelector('.cv-s'), tx=tip.querySelector('.cv-x');
  function show(el){
    var vx=parseFloat(el.getAttribute('data-vx')),
        vy=parseFloat(el.getAttribute('data-vy')),
        s=svg.getBoundingClientRect().width/800,
        extra=el.getAttribute('data-x');
    ring.setAttribute('cx',vx); ring.setAttribute('cy',vy);
    ring.setAttribute('stroke',el.getAttribute('data-c'));
    ring.setAttribute('opacity','1');
    tv.textContent=el.getAttribute('data-v');
    ts.textContent=el.getAttribute('data-s');
    tx.textContent=extra;
    if(extra){tx.classList.add('on');} else {tx.classList.remove('on');}
    tip.classList.add('on');
    var w=tip.offsetWidth, ww=wrap.clientWidth,
        left=Math.min(Math.max(vx*s, w/2+2), ww-w/2-2);
    tip.style.left=left+'px';
    var top=vy*s-14;
    if(top-tip.offsetHeight<2){tip.classList.add('below'); top=vy*s+14;}
    else {tip.classList.remove('below');}
    tip.style.top=top+'px';
  }
  function hide(){tip.classList.remove('on'); ring.setAttribute('opacity','0');}
  var pts=root.querySelectorAll('.cv-hit'), i;
  for(i=0;i<pts.length;i++){
    (function(el){
      el.addEventListener('mouseenter',function(){show(el);});
      el.addEventListener('focus',function(){show(el);});
      el.addEventListener('mouseleave',hide);
      el.addEventListener('blur',hide);
    })(pts[i]);
  }
  svg.addEventListener('mouseleave',hide);
})();
</script>
