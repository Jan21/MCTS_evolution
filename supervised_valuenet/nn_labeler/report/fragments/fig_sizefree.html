<figure class="fig figc-sizefree">
<style>
.figc-sizefree .ttl{font-size:14px;font-weight:600;color:var(--fg);margin:0 0 3px}
.figc-sizefree .hint{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.45}
.figc-sizefree text{font-size:12px}
.figc-sizefree text.bl{font-size:13px}
.figc-sizefree text.bx{font-size:14px;font-weight:600}
.figc-sizefree text.ko{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
</style>

<div class="ttl">One network reads any board size</div>
<div class="hint">A board is handed over as a set of squares joined by the slides a robot could make &mdash; not as a picture of a fixed width. Nothing left inside the network is tied to one board size.</div>

<svg viewBox="0 0 760 430" role="img" aria-label="A six by six board and a ten by ten board, each marked with curved links between squares a robot could slide between. Both feed downwards into a single rounded box labelled the same network, no size dial inside. Beside it a crossed-out box marked position table, removed.">
  <defs>
    <marker id="sfArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.6 L9.4,5 L0,9.4 Z" fill="var(--muted)" />
    </marker>
    <marker id="sfLink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="var(--s1)" />
    </marker>
  </defs>

  <text x="110" y="22" fill="var(--muted)">cells connect where a robot could slide</text>

  <!-- small board: 6 x 6 -->
  <text x="176" y="46" class="bl" fill="var(--fg)" text-anchor="middle">a small board</text>
  <rect x="110" y="56" width="132" height="132" fill="var(--card)" />
  <g stroke="var(--line)" stroke-width="1">
    <line x1="132" y1="56" x2="132" y2="188" /><line x1="154" y1="56" x2="154" y2="188" />
    <line x1="176" y1="56" x2="176" y2="188" /><line x1="198" y1="56" x2="198" y2="188" />
    <line x1="220" y1="56" x2="220" y2="188" />
    <line x1="110" y1="78" x2="242" y2="78" /><line x1="110" y1="100" x2="242" y2="100" />
    <line x1="110" y1="122" x2="242" y2="122" /><line x1="110" y1="144" x2="242" y2="144" />
    <line x1="110" y1="166" x2="242" y2="166" />
  </g>
  <rect x="110" y="56" width="132" height="132" fill="none" stroke="var(--fg)" stroke-width="1.5" />
  <g fill="none" stroke="var(--s1)" stroke-width="2">
    <path d="M121,89 Q154,64 187,89" />
    <path d="M187,89 Q214,122 187,155" marker-end="url(#sfLink)" />
  </g>
  <g fill="var(--s1)" stroke="var(--bg)" stroke-width="1.5">
    <circle cx="121" cy="89" r="4" /><circle cx="187" cy="89" r="4" />
  </g>

  <!-- bigger board: 10 x 10 -->
  <text x="410" y="46" class="bl" fill="var(--fg)" text-anchor="middle">a bigger board</text>
  <rect x="300" y="56" width="220" height="220" fill="var(--card)" />
  <g stroke="var(--line)" stroke-width="1">
    <line x1="322" y1="56" x2="322" y2="276" /><line x1="344" y1="56" x2="344" y2="276" />
    <line x1="366" y1="56" x2="366" y2="276" /><line x1="388" y1="56" x2="388" y2="276" />
    <line x1="410" y1="56" x2="410" y2="276" /><line x1="432" y1="56" x2="432" y2="276" />
    <line x1="454" y1="56" x2="454" y2="276" /><line x1="476" y1="56" x2="476" y2="276" />
    <line x1="498" y1="56" x2="498" y2="276" />
    <line x1="300" y1="78" x2="520" y2="78" /><line x1="300" y1="100" x2="520" y2="100" />
    <line x1="300" y1="122" x2="520" y2="122" /><line x1="300" y1="144" x2="520" y2="144" />
    <line x1="300" y1="166" x2="520" y2="166" /><line x1="300" y1="188" x2="520" y2="188" />
    <line x1="300" y1="210" x2="520" y2="210" /><line x1="300" y1="232" x2="520" y2="232" />
    <line x1="300" y1="254" x2="520" y2="254" />
  </g>
  <rect x="300" y="56" width="220" height="220" fill="none" stroke="var(--fg)" stroke-width="1.5" />
  <g fill="none" stroke="var(--s1)" stroke-width="2">
    <path d="M333,111 Q388,82 443,111" />
    <path d="M443,111 Q476,166 443,221" />
    <path d="M443,221 Q476,250 509,221" marker-end="url(#sfLink)" />
  </g>
  <g fill="var(--s1)" stroke="var(--bg)" stroke-width="1.5">
    <circle cx="333" cy="111" r="4" /><circle cx="443" cy="111" r="4" /><circle cx="443" cy="221" r="4" />
  </g>

  <!-- both feed the same network -->
  <g fill="none" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#sfArrow)">
    <path d="M176,196 C176,244 218,272 264,318" />
    <path d="M410,284 C410,300 400,306 392,318" />
  </g>

  <rect x="240" y="326" width="280" height="86" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="1.5" />
  <text x="380" y="364" class="bx" fill="var(--fg)" text-anchor="middle">the same network</text>
  <text x="380" y="388" fill="var(--muted)" text-anchor="middle">no size dial inside</text>

  <!-- the part that had to go -->
  <line x1="520" y1="369" x2="554" y2="369" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" />
  <rect x="558" y="339" width="172" height="60" rx="8" fill="var(--bg)" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g stroke="var(--muted)" stroke-width="2" opacity="0.45">
    <line x1="560" y1="341" x2="728" y2="397" /><line x1="728" y1="341" x2="560" y2="397" />
  </g>
  <text x="644" y="365" class="ko" fill="var(--muted)" text-anchor="middle">position table</text>
  <text x="644" y="385" class="ko" fill="var(--muted)" text-anchor="middle">(removed)</text>
</svg>
</figure>
