<figure class="fig figc-collapse">
<style>
.figc-collapse .ttl{font-size:14px;font-weight:600;color:var(--fg);margin:0 0 3px}
.figc-collapse .hint{font-size:12.5px;color:var(--muted);margin:0 0 8px;line-height:1.45}
.figc-collapse .lg{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:0 0 6px;font-size:12.5px;color:var(--muted)}
.figc-collapse .lg em{font-style:normal;display:inline-flex;align-items:center;gap:7px}
.figc-collapse .k{width:14px;height:3px;border-radius:2px;display:inline-block}
.figc-collapse .cl-wrap{position:relative}
.figc-collapse text{font-size:12px}
.figc-collapse g.el text{font-size:13px;font-weight:600}
.figc-collapse .cl-band{outline:none}
.figc-collapse .cl-tip{position:absolute;display:none;transform:translate(-50%,-100%);
  background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 9px;
  font-size:12px;line-height:1.5;color:var(--muted);pointer-events:none;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.figc-collapse .cl-tip.on{display:block}
.figc-collapse .cl-tip.below{transform:translate(-50%,0)}
.figc-collapse .cl-h{color:var(--fg);font-weight:600;margin-bottom:2px}
.figc-collapse .cl-row{display:flex;align-items:center;gap:6px}
.figc-collapse .cl-row b{color:var(--fg);font-variant-numeric:tabular-nums}
.figc-collapse .cl-k1{width:12px;height:3px;border-radius:2px;background:var(--s1);display:inline-block}
.figc-collapse .cl-k2{width:12px;height:3px;border-radius:2px;background:var(--s2);display:inline-block}
</style>

<div class="ttl">One run learned, seven flat-lined</div>
<div class="hint">Eight runs were started the same way. The line that comes down is the one run that learned; the line that stays high is a run that never got off the ground, and it stayed that way for every round. Lower is better.</div>

<div class="lg">
  <em><span class="k" style="background:var(--s1)"></span>the run that learned</em>
  <em><span class="k" style="background:var(--s2)"></span>a run that stayed stuck</em>
</div>

<script>
(function(){
  var root=document.querySelector('.figc-collapse');
  if(!root) return;
  var svg=root.querySelector('svg'), wrap=root.querySelector('.cl-wrap'),
      tip=root.querySelector('.cl-tip'), cross=root.querySelector('#clCross'),
      rA=root.querySelector('#clRingA'), rB=root.querySelector('#clRingB'),
      h=tip.querySelector('.cl-h'), v1=tip.querySelector('.cl-v1'), v2=tip.querySelector('.cl-v2');
  function show(el){
    var vx=parseFloat(el.getAttribute('data-x')),
        ya=parseFloat(el.getAttribute('data-ya')),
        yb=parseFloat(el.getAttribute('data-yb')),
        s=svg.getBoundingClientRect().width/800;
    cross.setAttribute('x1',vx); cross.setAttribute('x2',vx); cross.setAttribute('opacity','0.5');
    rA.setAttribute('cx',vx); rA.setAttribute('cy',ya); rA.setAttribute('opacity','1');
    rB.setAttribute('cx',vx); rB.setAttribute('cy',yb); rB.setAttribute('opacity','1');
    h.textContent='round '+el.getAttribute('data-r');
    v1.textContent=el.getAttribute('data-a');
    v2.textContent=el.getAttribute('data-b');
    tip.classList.add('on');
    var w=tip.offsetWidth, ww=wrap.clientWidth,
        left=Math.min(Math.max(vx*s, w/2+2), ww-w/2-2);
    tip.style.left=left+'px';
    var anchor=Math.min(ya,yb)*s, top=anchor-14;
    if(top-tip.offsetHeight<2){tip.classList.add('below'); top=anchor+14;}
    else {tip.classList.remove('below');}
    tip.style.top=top+'px';
  }
  function hide(){
    tip.classList.remove('on');
    cross.setAttribute('opacity','0');
    rA.setAttribute('opacity','0'); rB.setAttribute('opacity','0');
  }
  var bands=root.querySelectorAll('.cl-band'), i;
  for(i=0;i<bands.length;i++){
    (function(el){
      el.addEventListener('mouseenter',function(){show(el);});
      el.addEventListener('focus',function(){show(el);});
      el.addEventListener('mouseleave',hide);
      el.addEventListener('blur',hide);
    })(bands[i]);
  }
  svg.addEventListener('mouseleave',hide);
})();
</script>
