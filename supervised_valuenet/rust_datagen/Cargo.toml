[package]
name = "rust_datagen"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Ricochet Robots training-data generation core (see DESIGN.md)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
bincode = "1.3"
sha2 = "0.10"
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
rustc-hash = "2"

[dev-dependencies]
flate2 = "1"

[[bin]]
name = "datagen"
path = "src/bin/datagen.rs"

[profile.release]
lto = true
codegen-units = 1

[profile.test]
opt-level = 2
