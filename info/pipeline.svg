<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1120" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L8,5 L0,9z" fill="#555"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L8,5 L0,9z" fill="#c0392b"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L8,5 L0,9z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L8,5 L0,9z" fill="#3498db"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L8,5 L0,9z" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="1120" rx="10" fill="#fafafa" stroke="#ddd"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Benchmark Pipeline</text>
  <text x="430" y="50" text-anchor="middle" font-size="11" fill="#7f8c8d">python benchmark.py --n_val N --n_eval M</text>

  <!-- ════════════════════════════════════════════ -->
  <!-- CLI Args box -->
  <!-- ════════════════════════════════════════════ -->
  <rect x="280" y="65" width="300" height="38" rx="7" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="430" y="89" text-anchor="middle" font-weight="bold" fill="#2c3e50">Parse CLI args: n_val, n_eval</text>

  <line x1="430" y1="103" x2="430" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- run() box -->
  <rect x="250" y="124" width="360" height="38" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="430" y="148" text-anchor="middle" font-weight="bold" fill="#2c3e50">run(algorithm, env_indices, n_val, n_eval)</text>

  <line x1="430" y1="162" x2="430" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ════════════════════════════════════════════ -->
  <!-- PHASE 1 -->
  <!-- ════════════════════════════════════════════ -->
  <rect x="50" y="196" width="760" height="380" rx="8" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="50" y="196" width="260" height="24" rx="5" fill="#3498db"/>
  <text x="70" y="213" font-size="12" font-weight="bold" fill="white">Phase 1: Validation + Eval (first n_val)</text>

  <!-- Load env -->
  <rect x="280" y="234" width="300" height="42" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="430" y="251" text-anchor="middle" font-size="11" fill="#7f8c8d">GridEnv.from_env(env_idx)</text>
  <text x="430" y="267" text-anchor="middle" font-weight="bold" fill="#2c3e50">Load environment</text>

  <line x1="430" y1="276" x2="430" y2="292" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Algorithm -->
  <rect x="280" y="296" width="300" height="42" rx="7" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="430" y="313" text-anchor="middle" font-size="11" fill="#7f8c8d">algorithm.solve(grid_env, state)</text>
  <text x="430" y="329" text-anchor="middle" font-weight="bold" fill="#2c3e50">Algorithm produces PartialPlan</text>

  <line x1="430" y1="338" x2="430" y2="354" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Validate -->
  <rect x="280" y="358" width="300" height="42" rx="7" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="430" y="375" text-anchor="middle" font-size="11" fill="#7f8c8d">validate(plan, grid_env, state)</text>
  <text x="430" y="391" text-anchor="middle" font-weight="bold" fill="#2c3e50">Run 10 validation checks</text>

  <line x1="430" y1="400" x2="430" y2="418" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Diamond -->
  <polygon points="430,422 495,452 430,482 365,452" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="430" y="456" text-anchor="middle" font-weight="bold" font-size="12" fill="#2c3e50">passed?</text>

  <!-- FAIL: left arrow to ABORT box -->
  <line x1="365" y1="452" x2="210" y2="452" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="288" y="444" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">NO</text>

  <rect x="100" y="434" width="106" height="36" rx="7" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="153" y="451" text-anchor="middle" font-weight="bold" font-size="12" fill="#c0392b">ABORT</text>
  <text x="153" y="465" text-anchor="middle" font-size="10" fill="#c0392b">return {}</text>

  <!-- PASS: down arrow -->
  <line x1="430" y1="482" x2="430" y2="500" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="444" y="496" font-size="11" fill="#27ae60" font-weight="bold">YES</text>

  <!-- Evaluate -->
  <rect x="280" y="504" width="300" height="42" rx="7" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="430" y="521" text-anchor="middle" font-size="11" fill="#7f8c8d">evaluate_plan(plan, grid_env)</text>
  <text x="430" y="537" text-anchor="middle" font-weight="bold" fill="#2c3e50">Compute metric</text>

  <!-- Store result label -->
  <text x="430" y="560" text-anchor="middle" font-size="10" fill="#7f8c8d">results[env_idx] = (plan, metric)</text>

  <!-- Phase 1 loop arrow: from evaluate right side, up and back to load env right side -->
  <path d="M580,525 L680,525 L680,255 L584,255" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <text x="694" y="400" font-size="11" fill="#3498db" font-weight="bold" transform="rotate(-90,694,400)">next env (i &lt; n_val)</text>

  <!-- ════════════════════════════════════════════ -->
  <!-- Arrow between phases -->
  <!-- ════════════════════════════════════════════ -->
  <line x1="430" y1="576" x2="430" y2="604" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="530" y="596" font-size="11" fill="#27ae60" font-weight="bold">all n_val passed</text>

  <!-- ════════════════════════════════════════════ -->
  <!-- PHASE 2 -->
  <!-- ════════════════════════════════════════════ -->
  <rect x="50" y="608" width="760" height="320" rx="8" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="50" y="608" width="320" height="24" rx="5" fill="#e67e22"/>
  <text x="70" y="625" font-size="12" font-weight="bold" fill="white">Phase 2: Eval only (remaining n_eval - n_val)</text>

  <!-- Diamond: already processed? -->
  <polygon points="430,650 510,678 430,706 350,678" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="430" y="674" text-anchor="middle" font-size="11" fill="#2c3e50">already in</text>
  <text x="430" y="686" text-anchor="middle" font-size="11" fill="#2c3e50">results?</text>

  <!-- Skip: left -->
  <line x1="350" y1="678" x2="245" y2="678" stroke="#95a5a6" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="298" y="670" text-anchor="middle" font-size="11" fill="#95a5a6">YES</text>
  <rect x="155" y="662" width="86" height="32" rx="7" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="198" y="683" text-anchor="middle" font-size="12" fill="#7f8c8d">skip</text>

  <!-- No: down -->
  <line x1="430" y1="706" x2="430" y2="724" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="444" y="720" font-size="11" fill="#555">NO</text>

  <!-- Load env -->
  <rect x="280" y="728" width="300" height="36" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="430" y="751" text-anchor="middle" font-weight="bold" fill="#2c3e50">Load environment</text>

  <line x1="430" y1="764" x2="430" y2="778" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Algorithm -->
  <rect x="280" y="782" width="300" height="36" rx="7" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="430" y="805" text-anchor="middle" font-weight="bold" fill="#2c3e50">Algorithm produces PartialPlan</text>

  <line x1="430" y1="818" x2="430" y2="832" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Evaluate only -->
  <rect x="280" y="836" width="300" height="36" rx="7" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="430" y="859" text-anchor="middle" font-weight="bold" fill="#2c3e50">Evaluate only (no validation)</text>

  <!-- Store result label -->
  <text x="430" y="886" text-anchor="middle" font-size="10" fill="#7f8c8d">results[env_idx] = (plan, metric)</text>

  <!-- Note box -->
  <rect x="620" y="828" width="170" height="48" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1"/>
  <text x="705" y="847" text-anchor="middle" font-size="10" fill="#e67e22">Validation passed on</text>
  <text x="705" y="860" text-anchor="middle" font-size="10" fill="#e67e22">the n_val sample.</text>
  <text x="705" y="873" text-anchor="middle" font-size="10" fill="#e67e22">Skip for efficiency.</text>

  <!-- Phase 2 loop arrow -->
  <path d="M580,854 L740,854 L740,670 L514,670" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <text x="756" y="770" font-size="11" fill="#e67e22" font-weight="bold" transform="rotate(-90,756,770)">next env (i &lt; n_eval)</text>

  <!-- ════════════════════════════════════════════ -->
  <!-- Arrow to results -->
  <!-- ════════════════════════════════════════════ -->
  <line x1="430" y1="928" x2="430" y2="950" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ════════════════════════════════════════════ -->
  <!-- RESULTS -->
  <!-- ════════════════════════════════════════════ -->
  <rect x="180" y="954" width="500" height="50" rx="8" fill="#2c3e50"/>
  <text x="430" y="975" text-anchor="middle" font-weight="bold" font-size="14" fill="white">Results: {env_idx: (plan, metric)}</text>
  <text x="430" y="995" text-anchor="middle" font-size="11" fill="#bdc3c7">Print summary: solved/failed, total/avg/min/max cost</text>

  <!-- ════════════════════════════════════════════ -->
  <!-- METRIC DETAIL -->
  <!-- ════════════════════════════════════════════ -->
  <rect x="50" y="1024" width="760" height="82" rx="7" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="70" y="1044" font-weight="bold" font-size="12" fill="#2c3e50">Metric: evaluate_plan(plan, grid_env)</text>
  <text x="70" y="1062" font-size="11" fill="#555">For each physical edge, compute shortest_path(start, end, support_pos). Sum all costs.</text>
  <text x="70" y="1080" font-size="11" fill="#555">support_pos is ONLY set when end is a bottleneck (use sibling support). Otherwise None.</text>
  <text x="70" y="1096" font-size="11" fill="#555">See metric_logic.svg for full details and nested plan example.</text>
</svg>
