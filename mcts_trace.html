<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCTS Debugger Visualizer</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

/* Top bar */
#top-bar { background: #16213e; padding: 8px 16px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #333; flex-shrink: 0; }
#top-bar .title { font-size: 14px; font-weight: 600; color: #a8d8ea; }
#top-bar .stat { font-size: 12px; color: #888; }
#top-bar .stat b { color: #e0e0e0; }

/* Main layout: left debugger + right viz */
#main { flex: 1; display: flex; gap: 2px; background: #333; min-height: 0; }
#debugger-col { width: 40%; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
#viz-col { width: 60%; display: flex; flex-direction: column; gap: 2px; min-height: 0; }

#pane-code { flex: 1; min-height: 0; }
#pane-watch { flex: 0 0 auto; max-height: 40%; transition: max-height 0.2s; }
#pane-watch.collapsed { max-height: 28px; }
#pane-watch.collapsed .pane-body { display: none; }

#pane-tree, #pane-dag, #pane-grid { flex: 1; min-height: 0; }

.pane { background: #1a1a2e; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.pane-header { background: #16213e; padding: 6px 12px; font-size: 12px; font-weight: 600; color: #a8d8ea; border-bottom: 1px solid #333; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
.pane-header.clickable { cursor: pointer; }
.pane-body { flex: 1; overflow: auto; position: relative; min-height: 0; }

/* Pseudocode styling */
.code-line { display: flex; font-family: 'Consolas', 'Fira Code', monospace; font-size: 12px; line-height: 1.7; padding: 0 8px; cursor: pointer; position: relative; }
.code-line:hover { background: rgba(255,255,255,0.05); }
.code-line .gutter { width: 28px; color: #555; text-align: right; padding-right: 8px; user-select: none; flex-shrink: 0; }
.code-line .code { white-space: pre; }
.code-line.active { background: rgba(255, 215, 0, 0.15); }
.code-line.active .gutter { color: #ffd700; }
.code-line.active::before { content: "\25B6"; position: absolute; left: 4px; color: #ffd700; font-size: 10px; line-height: 1.7; }
.code-line.phase-bg { background: rgba(168, 216, 234, 0.05); }
.code-line.dimmed { opacity: 0.35; }
.code-comment { color: #6a9955; }
.code-keyword { color: #c586c0; }
.code-function { color: #dcdcaa; }
.code-number { color: #b5cea8; }

/* Watch panel */
#watch-pane { padding: 8px 12px; font-size: 12px; }
#watch-pane table { width: 100%; border-collapse: collapse; }
#watch-pane td, #watch-pane th { padding: 2px 6px; text-align: left; border-bottom: 1px solid #333; }
#watch-pane th { color: #888; font-weight: normal; width: 40%; }

/* Timeline */
#timeline { background: #16213e; padding: 8px 16px; border-top: 1px solid #333; flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
#timeline button { background: #0f3460; color: #e0e0e0; border: 1px solid #555; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
#timeline button:hover { background: #1a5276; }
#timeline button.active { background: #2980b9; }
#timeline input[type=range] { flex: 1; accent-color: #a8d8ea; }
#timeline .iter-label { font-size: 12px; min-width: 140px; }
#bookmark-bar { display: flex; gap: 4px; margin-left: 8px; }
.bookmark { width: 8px; height: 8px; border-radius: 50%; cursor: pointer; border: 1px solid #555; }
.bookmark.new-best { background: #2ecc71; }
.bookmark.first-complete { background: #f39c12; }

/* Tree pane */
#tree-pane svg { width: 100%; height: 100%; }
.tree-node circle { cursor: pointer; stroke-width: 2; }
.tree-node text { font-size: 10px; fill: #ccc; }
.tree-link { fill: none; stroke: #555; stroke-width: 1.5; }
.tree-link.selection-path { stroke: #ffd700; stroke-width: 3; }
.tree-link.backprop-path { stroke: #4ecdc4; stroke-width: 2.5; stroke-dasharray: 4,2; }
.tree-node.selected circle { stroke: #ffd700; stroke-width: 3; }

/* DAG pane */
#dag-pane svg { width: 100%; height: 100%; }
.dag-node { cursor: pointer; }
.dag-node text { font-size: 10px; fill: #ccc; }
.dag-edge { fill: none; stroke-width: 1.5; }
.dag-edge.fixed { stroke: #4ecdc4; }
.dag-edge.open { stroke: #e74c3c; stroke-dasharray: 5,3; }
.dag-edge.structural { stroke: #555; stroke-width: 1; }
.dag-edge-label { font-size: 9px; fill: #888; }
.dag-node.new-node { filter: drop-shadow(0 0 4px #2ecc71); }
.dag-edge.target-edge { stroke: #ffd700; stroke-width: 3; stroke-dasharray: none; }

#grid-canvas { display: block; }

.cost-low { color: #2ecc71; }
.cost-mid { color: #f39c12; }
.cost-high { color: #e74c3c; }
</style>
</head>
<body>

<div id="top-bar">
  <span class="title">MCTS Debugger</span>
  <span class="stat">Iteration: <b id="stat-iter">0</b></span>
  <span class="stat">Best Cost: <b id="stat-best">-</b></span>
  <span class="stat">Tree Nodes: <b id="stat-nodes">1</b></span>
  <span class="stat">Plans Found: <b id="stat-plans">0</b></span>
</div>

<div id="main">
  <!-- Left: Debugger -->
  <div id="debugger-col">
    <div class="pane" id="pane-code">
      <div class="pane-header"><span>Pseudocode</span><span id="code-phase" style="font-weight:normal;color:#888;"></span></div>
      <div class="pane-body" id="code-pane"></div>
    </div>
    <div class="pane" id="pane-watch">
      <div class="pane-header clickable" id="watch-header"><span>Watch</span><span id="watch-toggle">&#9660;</span></div>
      <div class="pane-body" id="watch-pane"></div>
    </div>
  </div>

  <!-- Right: Visualizations -->
  <div id="viz-col">
    <div class="pane" id="pane-tree">
      <div class="pane-header"><span>MCTS Search Tree</span><span id="tree-info" style="font-weight:normal;color:#888;"></span></div>
      <div class="pane-body" id="tree-pane"></div>
    </div>
    <div class="pane" id="pane-dag">
      <div class="pane-header"><span>Partial Plan DAG</span><span id="dag-info" style="font-weight:normal;color:#888;"></span></div>
      <div class="pane-body" id="dag-pane"></div>
    </div>
    <div class="pane" id="pane-grid">
      <div class="pane-header"><span>Grid Board</span><span id="grid-info" style="font-weight:normal;color:#888;"></span></div>
      <div class="pane-body" id="grid-pane"><canvas id="grid-canvas"></canvas></div>
    </div>
  </div>
</div>

<div id="timeline">
  <button id="btn-prev-iter" title="Previous iteration (Shift+Left)">&#8676;</button>
  <button id="btn-prev" title="Previous step (Left)">&#9668;</button>
  <button id="btn-play" title="Play/Pause (Space)">&#9654;</button>
  <button id="btn-next" title="Next step (Right)">&#9658;</button>
  <button id="btn-next-iter" title="Next iteration (Shift+Right)">&#8677;</button>
  <input type="range" id="slider" min="0" max="0" value="0">
  <span class="iter-label" id="slider-label">iter 0, step 0/0</span>
  <div id="bookmark-bar"></div>
</div>

function renderPseudocode(activeLineId, activePhase, executedLineIds) {
  const pane = document.getElementById("code-pane");
  let html = "";
  PSEUDOCODE.forEach(([num, indent, text, phase, lineId]) => {
    const isActive = lineId === activeLineId;
    const isPhase = phase === activePhase;
    const isExecuted = executedLineIds.has(lineId);
    const isDimmed = activePhase && phase && phase !== activePhase && !isExecuted;

    let cls = "code-line";
    if (isActive) cls += " active";
    else if (isPhase) cls += " phase-bg";
    if (isDimmed) cls += " dimmed";

    // Syntax highlight
    let highlighted = text
      .replace(/^(# .*)$/, '<span class="code-comment">$1</span>')
      .replace(/\b(for|in|if|while|break|goto|not|or|is)\b/g, '<span class="code-keyword">$1</span>')
      .replace(/\b(can_expand|argmin|max|evaluate|get_candidates|sorted|apply_subgoal|close_optimal_edges|close_all_closeable_edges|random|random_top_half|copy|is_complete)\b/g, '<span class="code-function">$1</span>');

    const indentStr = "  ".repeat(indent);
    html += `<div class="${cls}" data-line-id="${lineId}">`;
    html += `<span class="gutter">${num}</span>`;
    html += `<span class="code">${indentStr}${highlighted}</span>`;
    html += `</div>`;
  });
  pane.innerHTML = html;

  // Click handler: jump to sub-step for this line
  pane.querySelectorAll(".code-line").forEach(el => {
    el.addEventListener("click", () => {
      const lid = el.dataset.lineId;
      jumpToLineInCurrentIteration(lid);
    });
  });

  // Scroll active line into view
  const activeLine = pane.querySelector(".code-line.active");
  if (activeLine) activeLine.scrollIntoView({ block: "center", behavior: playing ? "instant" : "smooth" });

  // Phase label
  document.getElementById("code-phase").textContent = activePhase ? activePhase.toUpperCase() : "";
}

// ============================================================
// SUB-STEP ENGINE
// ============================================================
function buildSubSteps(ev, evIndex) {
  const steps = [];
  const phase = ev.phase;

  // --- SELECTION ---
  steps.push({
    lineId: "select_start", phase: "select",
    vars: { node: ev.selection_path?.[0] ?? 0 },
    context: { treeHighlight: { selectionPath: [ev.selection_path?.[0] ?? 0] } }
  });

  if (ev.selection_path && ev.selection_path.length > 1) {
    for (let i = 1; i < ev.selection_path.length; i++) {
      const pathSoFar = ev.selection_path.slice(0, i + 1);
      const nodeId = ev.selection_path[i];

      if (Object.keys(ev.lcb_scores || {}).length > 0) {
        steps.push({
          lineId: "select_lcb", phase: "select",
          vars: {
            node: nodeId,
            viable_count: Object.keys(ev.lcb_scores).length,
            lcb_scores: ev.lcb_scores,
          },
          context: { treeHighlight: { selectionPath: pathSoFar, lcbScores: ev.lcb_scores } }
        });
      } else {
        steps.push({
          lineId: "select_while", phase: "select",
          vars: { node: nodeId },
          context: { treeHighlight: { selectionPath: pathSoFar } }
        });
      }
    }
  }

  // --- PHASE BRANCHING ---
  if (phase === "complete_node") {
    steps.push({
      lineId: "expand_complete_check", phase: "expand",
      vars: { is_complete: true },
      context: { treeHighlight: { selectedNode: ev.selected_node_id } }
    });
    steps.push({
      lineId: "expand_complete_eval", phase: "expand",
      vars: { cost: ev.backprop_cost },
      context: { treeHighlight: { selectedNode: ev.selected_node_id }, dagPlan: ev.plan_snapshot }
    });
    steps.push({
      lineId: "expand_complete_goto", phase: "expand",
      vars: {},
      context: { treeHighlight: { selectedNode: ev.selected_node_id } }
    });

  } else if (phase === "dead_end") {
    steps.push({
      lineId: "expand_pick_edge", phase: "expand",
      vars: { edge: ev.target_edge },
      context: {
        treeHighlight: { selectedNode: ev.selected_node_id },
        dagPlan: ev.plan_snapshot,
        dagHighlight: { targetEdge: ev.target_edge },
      }
    });
    steps.push({
      lineId: "expand_candidates", phase: "expand",
      vars: { candidates_count: 0 },
      context: { dagPlan: ev.plan_snapshot, dagHighlight: { targetEdge: ev.target_edge } }
    });
    steps.push({
      lineId: "expand_dead_end", phase: "expand",
      vars: { cost: ev.backprop_cost },
      context: { dagPlan: ev.plan_snapshot }
    });

  } else if (phase === "select_expand_rollout") {
    // EXPANSION
    if (ev.target_edge) {
      steps.push({
        lineId: "expand_pick_edge", phase: "expand",
        vars: { edge: ev.target_edge },
        context: {
          treeHighlight: { selectedNode: ev.selected_node_id },
          dagPlan: ev.plan_snapshot,
          dagHighlight: { targetEdge: ev.target_edge },
        }
      });
    }
    steps.push({
      lineId: "expand_candidates", phase: "expand",
      vars: { candidates_count: ev.candidates_count },
      context: {
        dagPlan: ev.plan_snapshot,
        dagHighlight: { targetEdge: ev.target_edge },
        gridHighlight: { positions: ev.candidate_positions || [], type: "candidates" },
      }
    });
    if (ev.action) {
      steps.push({
        lineId: "expand_apply", phase: "expand",
        vars: {
          bn_pos: ev.action.bn_pos,
          sp_pos: ev.action.sp_pos,
          helper_color: ev.action.helper_color,
        },
        context: {
          treeHighlight: { selectedNode: ev.selected_node_id, expandedChild: ev.expanded_child_id },
          dagPlan: ev.plan_snapshot,
          dagHighlight: { targetEdge: ev.target_edge, action: ev.action },
          gridHighlight: { positions: [ev.action.bn_pos, ev.action.sp_pos], type: "subgoal" },
        }
      });
      steps.push({
        lineId: "expand_close", phase: "expand",
        vars: { closed: ev.expansion_closed_edges || [] },
        context: { dagPlan: ev.plan_snapshot }
      });
    }

    // ROLLOUT
    if (ev.rollout_steps && ev.rollout_steps.length > 0) {
      steps.push({
        lineId: "rollout_copy", phase: "rollout",
        vars: {},
        context: {
          treeHighlight: { expandedChild: ev.expanded_child_id },
          dagPlan: ev.plan_snapshot,
        }
      });

      ev.rollout_steps.forEach((rs, i) => {
        if (rs.type === "close_only") {
          steps.push({
            lineId: "rollout_close", phase: "rollout",
            vars: { step: rs.step, closed: rs.closed },
            context: { treeHighlight: { expandedChild: ev.expanded_child_id } }
          });
          steps.push({
            lineId: "rollout_done", phase: "rollout",
            vars: { step: rs.step },
            context: { treeHighlight: { expandedChild: ev.expanded_child_id } }
          });
        } else if (rs.type === "no_candidates") {
          steps.push({
            lineId: "rollout_pick", phase: "rollout",
            vars: { step: rs.step, edge: rs.edge },
            context: { treeHighlight: { expandedChild: ev.expanded_child_id } }
          });
        } else if (rs.type === "subgoal") {
          steps.push({
            lineId: "rollout_subgoal", phase: "rollout",
            vars: {
              step: rs.step,
              bn_pos: rs.bn_pos,
              sp_pos: rs.sp_pos,
              helper_color: rs.helper_color,
              candidates_count: rs.candidates_count,
              applied: rs.applied,
            },
            context: {
              treeHighlight: { expandedChild: ev.expanded_child_id },
              gridHighlight: { positions: [rs.bn_pos, rs.sp_pos], type: "rollout" },
            }
          });
        }
      });

      steps.push({
        lineId: "rollout_eval", phase: "rollout",
        vars: { cost: ev.rollout_cost, completed: ev.rollout_completed },
        context: { treeHighlight: { expandedChild: ev.expanded_child_id } }
      });
    }
  }

  // --- BACKPROP ---
  steps.push({
    lineId: "backprop_loop", phase: "backprop",
    vars: { cost: ev.backprop_cost },
    context: {
      treeHighlight: { backpropPath: ev.selection_path, backpropChild: ev.expanded_child_id },
      dagPlan: ev.plan_snapshot,
    }
  });

  const backpropPath = [...(ev.selection_path || [])].reverse();
  if (ev.expanded_child_id !== null && ev.expanded_child_id !== undefined) {
    backpropPath.unshift(ev.expanded_child_id);
  }
  backpropPath.forEach((nodeId, i) => {
    steps.push({
      lineId: i < backpropPath.length - 1 ? "backprop_up" : "backprop_visit",
      phase: "backprop",
      vars: { node: nodeId, cost: ev.backprop_cost },
      context: {
        treeHighlight: {
          backpropPath: backpropPath.slice(0, i + 1),
          backpropNode: nodeId,
        },
      }
    });
  });

  return steps;
}

// Pre-compute all sub-steps
const allSubSteps = [];
const iterationBoundaries = [];
events.forEach((ev, i) => {
  iterationBoundaries.push(allSubSteps.length);
  const steps = buildSubSteps(ev, i);
  steps.forEach((s, j) => {
    allSubSteps.push({ ...s, eventIndex: i, stepIndex: j, totalSteps: steps.length });
  });
});

// Lookup: expanded_child_id -> event index (for tree node click)
const expandedChildToEvent = {};
events.forEach((ev, i) => {
  if (ev.expanded_child_id !== null && ev.expanded_child_id !== undefined) {
    expandedChildToEvent[ev.expanded_child_id] = i;
  }
});

// ============================================================
// HELPERS
// ============================================================
function fmtCost(c) {
  if (c === null || c === undefined) return "-";
  if (c === Infinity || c > 999) return "\u221E";
  return Number(c).toFixed(1);
}
function costClass(c) {
  if (c === null || c === undefined || c === Infinity || c > 500) return "cost-high";
  if (c < 10) return "cost-low";
  if (c < 30) return "cost-mid";
  return "cost-high";
}
function fmtPos(p) {
  if (!p) return "?";
  return `(${p[0]},${p[1]})`;
}
function costColor(avgCost) {
  if (avgCost === null || avgCost === undefined || avgCost === Infinity || avgCost > 500) return "#e74c3c";
  if (avgCost < 8) return "#2ecc71";
  if (avgCost < 15) return "#f1c40f";
  if (avgCost < 30) return "#e67e22";
  return "#e74c3c";
}

// ============================================================
// NAVIGATION STATE
// ============================================================
let currentSubStep = 0;
let playing = false;
let playTimer = null;

const slider = document.getElementById("slider");
const sliderLabel = document.getElementById("slider-label");
slider.max = Math.max(0, events.length - 1);

function getCurrentIterationIndex() {
  const ss = allSubSteps[currentSubStep];
  return ss ? ss.eventIndex : 0;
}

function setSubStep(idx) {
  if (allSubSteps.length === 0) return;
  currentSubStep = Math.max(0, Math.min(idx, allSubSteps.length - 1));
  const ss = allSubSteps[currentSubStep];
  if (!ss) return;
  slider.value = ss.eventIndex;
  const nextBound = iterationBoundaries[ss.eventIndex + 1];
  const iterSteps = (nextBound !== undefined ? nextBound : allSubSteps.length) - iterationBoundaries[ss.eventIndex];
  const stepInIter = currentSubStep - iterationBoundaries[ss.eventIndex];
  sliderLabel.textContent = `iter ${ss.eventIndex + 1}/${events.length}, step ${stepInIter + 1}/${iterSteps}`;
  updateAll();
}

function nextSubStep() { stopPlay(); setSubStep(currentSubStep + 1); }
function prevSubStep() { stopPlay(); setSubStep(currentSubStep - 1); }
function nextIteration() {
  stopPlay();
  const curIter = getCurrentIterationIndex();
  if (curIter + 1 < iterationBoundaries.length) {
    setSubStep(iterationBoundaries[curIter + 1]);
  }
}
function prevIteration() {
  stopPlay();
  const curIter = getCurrentIterationIndex();
  if (curIter > 0) {
    setSubStep(iterationBoundaries[curIter - 1]);
  } else {
    setSubStep(0);
  }
}

function jumpToLineInCurrentIteration(lineId) {
  const curIter = getCurrentIterationIndex();
  const start = iterationBoundaries[curIter];
  const end = iterationBoundaries[curIter + 1] || allSubSteps.length;
  for (let i = start; i < end; i++) {
    if (allSubSteps[i].lineId === lineId) {
      setSubStep(i);
      return;
    }
  }
}

function jumpToPhase(phase) {
  const curIter = getCurrentIterationIndex();
  const start = iterationBoundaries[curIter];
  const end = iterationBoundaries[curIter + 1] || allSubSteps.length;
  for (let i = start; i < end; i++) {
    if (allSubSteps[i].phase === phase) {
      setSubStep(i);
      return;
    }
  }
}

function startPlay() {
  playing = true;
  document.getElementById("btn-play").textContent = "\u23F8";
  document.getElementById("btn-play").classList.add("active");
  playTimer = setInterval(() => {
    if (currentSubStep >= allSubSteps.length - 1) { stopPlay(); return; }
    setSubStep(currentSubStep + 1);
  }, 300);
}
function stopPlay() {
  playing = false;
  document.getElementById("btn-play").textContent = "\u25B6";
  document.getElementById("btn-play").classList.remove("active");
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
}

// ============================================================
// TIMELINE WIRING
// ============================================================
slider.addEventListener("input", () => {
  const iterIdx = parseInt(slider.value);
  setSubStep(iterationBoundaries[iterIdx] || 0);
});

document.getElementById("btn-prev").addEventListener("click", prevSubStep);
document.getElementById("btn-next").addEventListener("click", nextSubStep);
document.getElementById("btn-prev-iter").addEventListener("click", prevIteration);
document.getElementById("btn-next-iter").addEventListener("click", nextIteration);
document.getElementById("btn-play").addEventListener("click", () => {
  if (playing) stopPlay(); else startPlay();
});

// Watch panel toggle
document.getElementById("watch-header").addEventListener("click", () => {
  document.getElementById("pane-watch").classList.toggle("collapsed");
  const toggle = document.getElementById("watch-toggle");
  toggle.textContent = document.getElementById("pane-watch").classList.contains("collapsed") ? "\u25B6" : "\u25BC";
});

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" && e.shiftKey) { e.preventDefault(); prevIteration(); }
  else if (e.key === "ArrowRight" && e.shiftKey) { e.preventDefault(); nextIteration(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); prevSubStep(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); nextSubStep(); }
  else if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else startPlay(); }
  else if (e.key === "1") jumpToPhase("select");
  else if (e.key === "2") jumpToPhase("expand");
  else if (e.key === "3") jumpToPhase("rollout");
  else if (e.key === "4") jumpToPhase("backprop");
});

// Bookmarks
const bookmarks = [];
{
  let firstComplete = false;
  let bestCost = Infinity;
  events.forEach((e, i) => {
    if (e.complete_plans_found > 0 && !firstComplete) {
      bookmarks.push({ index: i, type: "first-complete" });
      firstComplete = true;
    }
    if (e.best_cost !== null && e.best_cost < bestCost) {
      bestCost = e.best_cost;
      bookmarks.push({ index: i, type: "new-best" });
    }
  });
  const bar = document.getElementById("bookmark-bar");
  bookmarks.forEach(b => {
    const dot = document.createElement("div");
    dot.className = `bookmark ${b.type}`;
    dot.title = `${b.type} at iteration ${b.index + 1}`;
    dot.addEventListener("click", () => { stopPlay(); setSubStep(iterationBoundaries[b.index] || 0); });
    bar.appendChild(dot);
  });
}

// ============================================================
// WATCH PANEL
// ============================================================
function renderWatch() {
  const pane = document.getElementById("watch-pane");
  const ss = allSubSteps[currentSubStep];
  if (!ss) { pane.innerHTML = ""; return; }

  const vars = ss.vars || {};
  const ev = events[ss.eventIndex];
  let html = "<table>";

  html += watchRow("iteration", ev.iteration);
  html += watchRow("phase", ss.phase);
  html += watchRow("best_cost", fmtCost(ev.best_cost));

  Object.entries(vars).forEach(([key, val]) => {
    html += watchRow(key, formatVar(key, val));
  });

  html += "</table>";
  pane.innerHTML = html;
}

function watchRow(key, val) {
  return `<tr><th>${key}</th><td>${val}</td></tr>`;
}

function formatVar(key, val) {
  if (val === null || val === undefined) return "-";
  if (key === "cost" || key === "rollout_cost" || key === "backprop_cost") return `<span class="${costClass(val)}">${fmtCost(val)}</span>`;
  if (key === "edge" && Array.isArray(val)) return `${val[0]} \u2192 ${val[1]}`;
  if (key === "bn_pos" || key === "sp_pos") return fmtPos(val);
  if (key === "lcb_scores" && typeof val === "object") {
    const entries = Object.entries(val).sort((a, b) => a[1] - b[1]);
    return entries.map(([nid, lcb]) => `${nid}:${lcb === -Infinity ? "-\u221E" : Number(lcb).toFixed(2)}`).join(", ");
  }
  if (key === "closed" && Array.isArray(val)) return val.map(e => e.join("\u2192")).join(", ");
  if (typeof val === "boolean") return val ? "\u2713" : "\u2717";
  if (typeof val === "number") return Number.isFinite(val) ? val.toString() : "\u221E";
  if (Array.isArray(val)) return JSON.stringify(val);
  return String(val);
}

// ============================================================
// MCTS TREE PANE (D3)
// ============================================================
let treeSvg, treeG, treeZoom;

function initTree() {
  const container = document.getElementById("tree-pane");
  treeSvg = d3.select(container).append("svg")
    .attr("width", "100%").attr("height", "100%");

  treeZoom = d3.zoom().scaleExtent([0.1, 5]).on("zoom", (e) => {
    treeG.attr("transform", e.transform);
  });
  treeSvg.call(treeZoom);
  treeG = treeSvg.append("g");

  treeSvg.append("defs").append("marker")
    .attr("id", "tree-arrow").attr("viewBox", "0 0 10 10")
    .attr("refX", 10).attr("refY", 5)
    .attr("markerWidth", 6).attr("markerHeight", 6)
    .attr("orient", "auto")
    .append("path").attr("d", "M0,0 L10,5 L0,10 Z").attr("fill", "#555");
}

function buildTreeHierarchy(upToIteration) {
  const existingNodes = new Set([0]);
  for (let i = 0; i <= upToIteration && i < events.length; i++) {
    const ev = events[i];
    if (ev.expanded_child_id !== null && ev.expanded_child_id !== undefined) {
      existingNodes.add(ev.expanded_child_id);
    }
  }

  const children = {};
  treeEdgesData.forEach(e => {
    if (existingNodes.has(e.source) && existingNodes.has(e.target)) {
      if (!children[e.source]) children[e.source] = [];
      children[e.source].push(e.target);
    }
  });

  function buildNode(id) {
    const node = { id, children: [] };
    if (children[id]) {
      node.children = children[id].map(cid => buildNode(cid));
    }
    return node;
  }

  return existingNodes.has(0) ? buildNode(0) : { id: 0, children: [] };
}

function renderTree() {
  if (!treeSvg) return;
  const ss = allSubSteps[currentSubStep];
  if (!ss) return;
  const ev = events[ss.eventIndex];
  if (!ev) return;

  const ctx = ss.context?.treeHighlight || {};

  const hierarchy = buildTreeHierarchy(ss.eventIndex);
  const root = d3.hierarchy(hierarchy);

  const containerEl = document.getElementById("tree-pane");
  const width = containerEl.clientWidth || 600;
  const height = containerEl.clientHeight || 400;

  const treeLayout = d3.tree().size([width - 80, Math.max(height - 80, root.height * 60)]);
  treeLayout(root);

  // Selection path edges
  const selectionPath = ctx.selectionPath || [];
  const selectionPathSet = new Set(selectionPath.map(String));
  const selectionPathEdges = new Set();
  for (let i = 0; i < selectionPath.length - 1; i++) {
    selectionPathEdges.add(`${selectionPath[i]}-${selectionPath[i+1]}`);
  }

  // Backprop path edges
  const backpropPath = ctx.backpropPath || [];
  const backpropChild = ctx.backpropChild;
  const backpropNodeHL = ctx.backpropNode;
  const backpropPathSet = new Set((ctx.backpropPath || []).map(String));
  const backpropPathEdges = new Set();
  // Build edges from backpropPath (includes child at front if present)
  const fullBackpropPath = [];
  if (backpropChild !== null && backpropChild !== undefined) {
    fullBackpropPath.push(backpropChild);
  }
  fullBackpropPath.push(...backpropPath);
  for (let i = 0; i < fullBackpropPath.length - 1; i++) {
    // Backprop goes child->parent, but tree edges are parent->child
    backpropPathEdges.add(`${fullBackpropPath[i+1]}-${fullBackpropPath[i]}`);
    backpropPathEdges.add(`${fullBackpropPath[i]}-${fullBackpropPath[i+1]}`);
  }

  const expandedChild = ctx.expandedChild;
  const selectedNode = ctx.selectedNode;

  // Links
  const links = treeG.selectAll(".tree-link").data(root.links(), d => `${d.source.data.id}-${d.target.data.id}`);
  links.exit().remove();
  const linksEnter = links.enter().append("path").attr("class", "tree-link");
  links.merge(linksEnter)
    .attr("d", d3.linkVertical().x(d => d.x + 40).y(d => d.y + 40))
    .classed("selection-path", d => selectionPathEdges.has(`${d.source.data.id}-${d.target.data.id}`))
    .classed("backprop-path", d => {
      const key = `${d.source.data.id}-${d.target.data.id}`;
      return backpropPathEdges.has(key) && ss.phase === "backprop";
    });

  // Nodes
  const nodes = treeG.selectAll(".tree-node").data(root.descendants(), d => d.data.id);
  nodes.exit().remove();
  const nodesEnter = nodes.enter().append("g").attr("class", "tree-node");
  nodesEnter.append("circle").attr("r", 6);
  nodesEnter.append("text").attr("dy", -10).attr("text-anchor", "middle");

  const allNodes = nodes.merge(nodesEnter);
  allNodes.attr("transform", d => `translate(${d.x + 40},${d.y + 40})`);

  allNodes.select("circle")
    .attr("r", d => {
      const nd = treeNodesData[d.data.id];
      return nd ? Math.max(4, Math.min(12, 4 + Math.sqrt(nd.visit_count))) : 5;
    })
    .attr("fill", d => {
      const nd = treeNodesData[d.data.id];
      return nd ? costColor(nd.avg_cost) : "#555";
    })
    .attr("stroke", d => {
      if (d.data.id === expandedChild) return "#ffd700";
      if (d.data.id === selectedNode) return "#a8d8ea";
      if (backpropNodeHL !== undefined && d.data.id === backpropNodeHL) return "#4ecdc4";
      const nd = treeNodesData[d.data.id];
      if (nd && nd.is_complete) return "#2ecc71";
      return "#555";
    })
    .attr("stroke-width", d => {
      if (d.data.id === expandedChild || d.data.id === selectedNode || d.data.id === backpropNodeHL) return 3;
      return 1.5;
    });

  allNodes.select("text")
    .text(d => {
      const nd = treeNodesData[d.data.id];
      if (!nd) return d.data.id;
      if (nd.visit_count === 0) return "";
      return nd.avg_cost === Infinity ? "" : nd.avg_cost.toFixed(1);
    });

  // Click: jump to iteration where this node was expanded
  allNodes.on("click", (e, d) => {
    const targetIter = expandedChildToEvent[d.data.id];
    if (targetIter !== undefined) {
      stopPlay();
      setSubStep(iterationBoundaries[targetIter] || 0);
    }
  });

  document.getElementById("tree-info").textContent = `${root.descendants().length} nodes`;
}

// ============================================================
// PLAN DAG PANE (D3)
// ============================================================
let dagSvg, dagG, dagZoom;

const NTYPE_SHAPES = {
  goal: { shape: "polygon", points: "0,-12 11.4,3.7 7,12 -7,12 -11.4,3.7", fill: "#f39c12" },
  subgoal: { shape: "polygon", points: "0,-10 10,0 0,10 -10,0", fill: "#9b59b6" },
  bottleneck: { shape: "rect", size: 10, fill: "#3498db" },
  support: { shape: "polygon", points: "0,-10 8.7,5 -8.7,5", fill: "#e67e22" },
  leaf: { shape: "circle", r: 7, fill: "#2ecc71" },
};

function initDAG() {
  const container = document.getElementById("dag-pane");
  dagSvg = d3.select(container).append("svg")
    .attr("width", "100%").attr("height", "100%");

  dagZoom = d3.zoom().scaleExtent([0.2, 5]).on("zoom", (e) => {
    dagG.attr("transform", e.transform);
  });
  dagSvg.call(dagZoom);
  dagG = dagSvg.append("g");

  const defs = dagSvg.append("defs");
  ["fixed", "open", "structural"].forEach(type => {
    const color = type === "fixed" ? "#4ecdc4" : type === "open" ? "#e74c3c" : "#555";
    defs.append("marker")
      .attr("id", `dag-arrow-${type}`).attr("viewBox", "0 0 10 10")
      .attr("refX", 20).attr("refY", 5)
      .attr("markerWidth", 5).attr("markerHeight", 5)
      .attr("orient", "auto")
      .append("path").attr("d", "M0,0 L10,5 L0,10 Z").attr("fill", color);
  });
  // Target edge arrow
  defs.append("marker")
    .attr("id", "dag-arrow-target").attr("viewBox", "0 0 10 10")
    .attr("refX", 20).attr("refY", 5)
    .attr("markerWidth", 5).attr("markerHeight", 5)
    .attr("orient", "auto")
    .append("path").attr("d", "M0,0 L10,5 L0,10 Z").attr("fill", "#ffd700");
}

function renderPlanDAG() {
  if (!dagSvg) return;
  const ss = allSubSteps[currentSubStep];
  if (!ss) return;
  const ev = events[ss.eventIndex];
  if (!ev) return;

  const plan = ss.context?.dagPlan || ev.plan_snapshot;
  if (!plan) { dagG.selectAll("*").remove(); return; }

  const dagHL = ss.context?.dagHighlight || {};
  const targetEdgeKey = dagHL.targetEdge ? `${dagHL.targetEdge[0]}-${dagHL.targetEdge[1]}` : null;

  const containerEl = document.getElementById("dag-pane");
  const width = containerEl.clientWidth || 400;
  const height = containerEl.clientHeight || 300;

  const nodeMap = {};
  plan.nodes.forEach(n => { nodeMap[n.id] = n; });

  const roots = plan.nodes.filter(n => n.ntype === "goal");
  const rootId = roots.length > 0 ? roots[0].id : plan.nodes[0]?.id;

  const childrenMap = {};
  plan.edges.forEach(e => {
    if (!childrenMap[e.source]) childrenMap[e.source] = [];
    childrenMap[e.source].push(e.target);
  });

  function buildHier(id, visited = new Set()) {
    if (visited.has(id)) return { id, children: [] };
    visited.add(id);
    const ch = (childrenMap[id] || []).map(cid => buildHier(cid, visited));
    return { id, children: ch };
  }

  const hierData = buildHier(rootId);
  const root = d3.hierarchy(hierData);

  const treeLayout = d3.tree().size([width - 60, Math.max(height - 60, root.height * 80)]);
  treeLayout(root);

  const posMap = {};
  root.descendants().forEach(d => { posMap[d.data.id] = { x: d.x + 30, y: d.y + 30 }; });

  dagG.selectAll("*").remove();

  const STRUCTURAL = new Set(["subgoal-bottleneck", "subgoal-support"]);

  // Edges
  plan.edges.forEach(e => {
    const srcPos = posMap[e.source];
    const tgtPos = posMap[e.target];
    if (!srcPos || !tgtPos) return;

    const srcNode = nodeMap[e.source];
    const tgtNode = nodeMap[e.target];
    const isStructural = srcNode && tgtNode && STRUCTURAL.has(`${srcNode.ntype}-${tgtNode.ntype}`);

    let edgeClass = isStructural ? "structural" : (e.status || "open");
    const edgeKey = `${e.source}-${e.target}`;
    const isTarget = edgeKey === targetEdgeKey;

    const line = dagG.append("line")
      .attr("class", `dag-edge ${edgeClass}`)
      .attr("x1", srcPos.x).attr("y1", srcPos.y)
      .attr("x2", tgtPos.x).attr("y2", tgtPos.y)
      .attr("marker-end", `url(#dag-arrow-${isTarget ? "target" : edgeClass})`);

    if (isTarget) {
      line.classed("target-edge", true);
    }

    if (!isStructural && e.cost !== null && e.cost !== undefined) {
      dagG.append("text")
        .attr("class", "dag-edge-label")
        .attr("x", (srcPos.x + tgtPos.x) / 2 + 5)
        .attr("y", (srcPos.y + tgtPos.y) / 2 - 3)
        .text(e.cost.toFixed(0));
    }
  });

  // Nodes
  plan.nodes.forEach(n => {
    const pos = posMap[n.id];
    if (!pos) return;

    const shape = NTYPE_SHAPES[n.ntype] || NTYPE_SHAPES.leaf;
    const g = dagG.append("g")
      .attr("class", "dag-node")
      .attr("transform", `translate(${pos.x},${pos.y})`);

    // Check if this node should glow (new node from action)
    if (dagHL.action && n.pos) {
      const actionBn = dagHL.action.bn_pos;
      const actionSp = dagHL.action.sp_pos;
      if ((n.ntype === "bottleneck" && actionBn && n.pos[0] === actionBn[0] && n.pos[1] === actionBn[1]) ||
          (n.ntype === "support" && actionSp && n.pos[0] === actionSp[0] && n.pos[1] === actionSp[1])) {
        g.classed("new-node", true);
      }
    }

    const fillColor = n.robot ? robotColor(n.robot.color) : shape.fill;

    if (shape.shape === "circle") {
      g.append("circle").attr("r", shape.r).attr("fill", fillColor).attr("stroke", "#fff").attr("stroke-width", 1);
    } else if (shape.shape === "rect") {
      g.append("rect").attr("x", -shape.size).attr("y", -shape.size)
        .attr("width", shape.size * 2).attr("height", shape.size * 2)
        .attr("fill", fillColor).attr("stroke", "#fff").attr("stroke-width", 1);
    } else if (shape.shape === "polygon") {
      g.append("polygon").attr("points", shape.points)
        .attr("fill", fillColor).attr("stroke", "#fff").attr("stroke-width", 1);
    }

    // Label
    let label = n.ntype === "goal" ? "G" : n.ntype === "subgoal" ? "SG" : "";
    if (n.pos) label = `(${n.pos[0]},${n.pos[1]})`;
    g.append("text").attr("dy", n.ntype === "goal" ? 22 : 18).attr("text-anchor", "middle")
      .attr("font-size", "9px").text(label);

    // Node ID label (small, above)
    g.append("text").attr("dy", -14).attr("text-anchor", "middle")
      .attr("font-size", "8px").attr("fill", "#666").text(n.id);
  });

  // Update info
  const openCount = plan.edges.filter(e => e.status === "open").length;
  const fixedCount = plan.edges.filter(e => e.status === "fixed").length;
  const totalCost = plan.edges.reduce((s, e) => s + (e.cost || 0), 0);
  document.getElementById("dag-info").textContent =
    `${plan.nodes.length} nodes, ${openCount} open, ${fixedCount} fixed, cost=${totalCost.toFixed(0)}`;
}

// ============================================================
// GRID BOARD PANE (Canvas)
// ============================================================
let gridCanvas, gridCtx;

function initGrid() {
  gridCanvas = document.getElementById("grid-canvas");
  gridCtx = gridCanvas.getContext("2d");
}

function renderGrid() {
  if (!gridCtx || !grid.bounds) return;

  const ss = allSubSteps[currentSubStep];
  const ev = ss ? events[ss.eventIndex] : null;

  const containerEl = document.getElementById("grid-pane");
  const w = containerEl.clientWidth || 400;
  const h = containerEl.clientHeight || 300;
  gridCanvas.width = w;
  gridCanvas.height = h;

  const { min_x, max_x, min_y, max_y } = grid.bounds;
  const cols = max_x - min_x + 1;
  const rows = max_y - min_y + 1;
  const cellSize = Math.min((w - 20) / cols, (h - 20) / rows);
  const ox = (w - cols * cellSize) / 2;
  const oy = (h - rows * cellSize) / 2;

  const ctx = gridCtx;
  ctx.clearRect(0, 0, w, h);

  // Grid lines
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= cols; x++) {
    ctx.beginPath();
    ctx.moveTo(ox + x * cellSize, oy);
    ctx.lineTo(ox + x * cellSize, oy + rows * cellSize);
    ctx.stroke();
  }
  for (let y = 0; y <= rows; y++) {
    ctx.beginPath();
    ctx.moveTo(ox, oy + y * cellSize);
    ctx.lineTo(ox + cols * cellSize, oy + y * cellSize);
    ctx.stroke();
  }

  // Walls
  ctx.strokeStyle = "#e0e0e0";
  ctx.lineWidth = 3;
  (grid.walls || []).forEach(wall => {
    const [fx, fy] = wall.from;
    const cx1 = ox + (fx - min_x) * cellSize;
    const cy1 = oy + (fy - min_y) * cellSize;

    ctx.beginPath();
    if (wall.side === "vertical") {
      ctx.moveTo(cx1 + cellSize, cy1);
      ctx.lineTo(cx1 + cellSize, cy1 + cellSize);
    } else {
      ctx.moveTo(cx1, cy1 + cellSize);
      ctx.lineTo(cx1 + cellSize, cy1 + cellSize);
    }
    ctx.stroke();
  });

  // Border
  ctx.strokeStyle = "#e0e0e0";
  ctx.lineWidth = 3;
  ctx.strokeRect(ox, oy, cols * cellSize, rows * cellSize);

  // Goal position
  if (initialState.target) {
    const [gx, gy] = initialState.target;
    const cx = ox + (gx - min_x + 0.5) * cellSize;
    const cy = oy + (gy - min_y + 0.5) * cellSize;
    ctx.fillStyle = "rgba(243, 156, 18, 0.3)";
    ctx.fillRect(ox + (gx - min_x) * cellSize + 1, oy + (gy - min_y) * cellSize + 1, cellSize - 2, cellSize - 2);
    ctx.fillStyle = "#f39c12";
    ctx.font = `${Math.max(10, cellSize * 0.4)}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("\u2605", cx, cy);
  }

  // Initial robot positions
  const allRobots = [];
  if (initialState.target_robot) allRobots.push(initialState.target_robot);
  (initialState.helpers || []).forEach(h => allRobots.push(h));
  allRobots.forEach(robot => {
    const [rx, ry] = robot.position;
    const cx = ox + (rx - min_x + 0.5) * cellSize;
    const cy = oy + (ry - min_y + 0.5) * cellSize;
    ctx.fillStyle = robotColor(robot.color);
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.arc(cx, cy, cellSize * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = "#fff";
    ctx.font = `bold ${Math.max(8, cellSize * 0.25)}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(robot.color[0].toUpperCase(), cx, cy);
  });

  // Plan nodes on grid
  const plan = ss?.context?.dagPlan || ev?.plan_snapshot;
  if (plan) {
    plan.nodes.forEach(n => {
      if (!n.pos) return;
      const [px, py] = n.pos;
      const cx = ox + (px - min_x + 0.5) * cellSize;
      const cy = oy + (py - min_y + 0.5) * cellSize;

      if (n.ntype === "bottleneck") {
        ctx.strokeStyle = n.robot ? robotColor(n.robot.color) : "#3498db";
        ctx.lineWidth = 2;
        const s = cellSize * 0.3;
        ctx.strokeRect(cx - s, cy - s, s * 2, s * 2);
      } else if (n.ntype === "support") {
        ctx.strokeStyle = n.robot ? robotColor(n.robot.color) : "#e67e22";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy - cellSize * 0.3);
        ctx.lineTo(cx + cellSize * 0.3, cy + cellSize * 0.2);
        ctx.lineTo(cx - cellSize * 0.3, cy + cellSize * 0.2);
        ctx.closePath();
        ctx.stroke();
      } else if (n.ntype === "leaf") {
        ctx.fillStyle = n.robot ? robotColor(n.robot.color) : "#2ecc71";
        ctx.beginPath();
        ctx.arc(cx, cy, cellSize * 0.25, 0, Math.PI * 2);
        ctx.fill();
        if (n.robot) {
          ctx.fillStyle = "#fff";
          ctx.font = `bold ${Math.max(8, cellSize * 0.25)}px sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(n.robot.color[0].toUpperCase(), cx, cy);
        }
      }
    });
  }

  // Context-aware grid highlights
  const gridHL = ss?.context?.gridHighlight || {};
  if (gridHL.positions) {
    gridHL.positions.forEach(pos => {
      if (!pos) return;
      const [hx, hy] = pos;
      if (gridHL.type === "candidates") {
        ctx.fillStyle = "rgba(52, 152, 219, 0.25)";
        ctx.fillRect(ox + (hx - min_x) * cellSize + 1, oy + (hy - min_y) * cellSize + 1, cellSize - 2, cellSize - 2);
        ctx.strokeStyle = "#3498db";
        ctx.lineWidth = 2;
        ctx.strokeRect(ox + (hx - min_x) * cellSize + 2, oy + (hy - min_y) * cellSize + 2, cellSize - 4, cellSize - 4);
      } else {
        ctx.strokeStyle = gridHL.type === "subgoal" ? "#ffd700" : "#a8d8ea";
        ctx.lineWidth = 3;
        ctx.strokeRect(ox + (hx - min_x) * cellSize + 2, oy + (hy - min_y) * cellSize + 2, cellSize - 4, cellSize - 4);
      }
    });
  }

  document.getElementById("grid-info").textContent = `${cols}x${rows} grid`;
}

// ============================================================
// UPDATE ALL
// ============================================================
function updateAll() {
  const ss = allSubSteps[currentSubStep];
  if (!ss) return;
  const ev = events[ss.eventIndex];

  // Stats bar
  document.getElementById("stat-iter").textContent = ev.iteration;
  document.getElementById("stat-best").textContent = fmtCost(ev.best_cost);
  document.getElementById("stat-nodes").textContent = ev.tree_node_count;
  document.getElementById("stat-plans").textContent = ev.complete_plans_found;

  // Build set of executed lineIds up to current sub-step in this iteration
  const curIter = ss.eventIndex;
  const start = iterationBoundaries[curIter];
  const executedLineIds = new Set();
  for (let i = start; i <= currentSubStep; i++) {
    executedLineIds.add(allSubSteps[i].lineId);
  }

  renderPseudocode(ss.lineId, ss.phase, executedLineIds);
  renderWatch();
  renderTree();
  renderPlanDAG();
  renderGrid();
}

// ============================================================
// INIT
// ============================================================
function init() {
  initTree();
  initDAG();
  initGrid();

  if (allSubSteps.length > 0) {
    setSubStep(0);
  } else {
    renderGrid();
  }
}

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    renderTree();
    renderPlanDAG();
    renderGrid();
  }, 100);
});

init();
</script>
