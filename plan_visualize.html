<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Partial Plan Visualizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #1a1a1a; color: #eee; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    h1 { margin-bottom: 16px; font-size: 1.2rem; color: #aaa; }
    #controls { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
    button {
      padding: 8px 18px; border: 1px solid #555; background: #2a2a2a; color: #eee;
      cursor: pointer; border-radius: 4px; font-family: monospace; font-size: 0.9rem;
    }
    button:hover { background: #3a3a3a; }
    button:disabled { opacity: 0.4; cursor: default; }
    .info-label { color: #aaa; font-size: 0.9rem; min-width: 80px; text-align: center; }
    .separator { color: #555; }
    canvas { border: 1px solid #444; background: #222; display: block; }
    #status { margin-top: 10px; color: #888; font-size: 0.8rem; min-height: 1.2em; }
    #legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; justify-content: center; font-size: 0.8rem; color: #aaa; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 16px; height: 16px; border-radius: 2px; border: 1px solid #555; }
    input[type=file] { display: none; }
    label.file-btn {
      padding: 8px 18px; border: 1px solid #555; background: #2a2a2a; color: #eee;
      cursor: pointer; border-radius: 4px; font-size: 0.9rem;
    }
    label.file-btn:hover { background: #3a3a3a; }
  </style>
</head>
<body>
  <h1>Partial Plan Visualizer</h1>
  <div id="controls">
    <label class="file-btn" for="file-input">Load JSON</label>
    <input type="file" id="file-input" accept=".json">
    <button id="btn-scene-prev" disabled>&#8592; Scene</button>
    <span id="scene-info" class="info-label">no data</span>
    <button id="btn-scene-next" disabled>Scene &#8594;</button>
    <span class="separator">|</span>
    <button id="btn-step-prev" disabled>&#8592; Step</button>
    <span id="step-info" class="info-label">-</span>
    <button id="btn-step-next" disabled>Step &#8594;</button>
  </div>
  <canvas id="canvas" width="900" height="600"></canvas>
  <div id="status">Load a JSON file to begin.</div>
  <div id="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:#e74c3c"></div>Goal</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#9b59b6"></div>Subgoal</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#e67e22"></div>Bottleneck</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#3498db"></div>Support</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#2ecc71"></div>Leaf</div>
    <div class="legend-item" style="margin-left:12px"><span style="border-top:2px solid #ccc;width:20px;display:inline-block"></span>&nbsp;Fixed</div>
    <div class="legend-item"><span style="border-top:2px dashed #888;width:20px;display:inline-block"></span>&nbsp;Open</div>
    <div class="legend-item" style="margin-left:12px;color:#888">&#8592;/&#8594; step sub-plans</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const btnScenePrev = document.getElementById('btn-scene-prev');
    const btnSceneNext = document.getElementById('btn-scene-next');
    const sceneInfo = document.getElementById('scene-info');
    const btnStepPrev = document.getElementById('btn-step-prev');
    const btnStepNext = document.getElementById('btn-step-next');
    const stepInfo = document.getElementById('step-info');
    const statusEl = document.getElementById('status');

    let scenes = [];    // each: { full_plan, sub_plans[] } or just a plain plan
    let currentScene = 0;
    let currentStep = 0; // 0 = full plan, 1..N = sub-plans

    const NODE_COLORS = {
      goal: '#e74c3c',
      subgoal: '#9b59b6',
      bottleneck: '#e67e22',
      support: '#3498db',
      leaf: '#2ecc71',
    };

    const NODE_RADIUS = 28;
    const LAYER_HEIGHT = 100;
    const MIN_NODE_SPACING = 90;

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          loadData(parsed);
          statusEl.textContent = `Loaded: ${file.name}`;
        } catch (err) {
          statusEl.textContent = `Error parsing JSON: ${err.message}`;
        }
      };
      reader.readAsText(file);
    });

    function loadData(parsed) {
      // Support multiple formats:
      // 1. Array of scenes: [{full_plan, sub_plans}, ...]
      // 2. Array of plain plans: [{nodes, edges}, ...]
      // 3. Single scene: {full_plan, sub_plans}
      // 4. Single plan: {nodes, edges}
      if (Array.isArray(parsed)) {
        scenes = parsed.map(normalizeScene);
      } else if (parsed.full_plan) {
        scenes = [normalizeScene(parsed)];
      } else if (parsed.nodes) {
        scenes = [normalizeScene(parsed)];
      } else if (parsed.plans) {
        scenes = parsed.plans.map(normalizeScene);
      } else {
        scenes = [normalizeScene(parsed)];
      }
      currentScene = 0;
      currentStep = 0;
      update();
    }

    function normalizeScene(item) {
      if (item.full_plan && item.sub_plans) {
        return item; // already structured
      }
      // Plain plan — wrap it
      return { full_plan: item, sub_plans: [] };
    }

    function getScene() {
      return scenes[currentScene] || null;
    }

    function getSubPlanCount() {
      const scene = getScene();
      if (!scene) return 0;
      return scene.sub_plans ? scene.sub_plans.length : 0;
    }

    function getCurrentPlan() {
      const scene = getScene();
      if (!scene) return null;
      if (currentStep === 0) return scene.full_plan;
      return scene.sub_plans[currentStep - 1] || scene.full_plan;
    }

    function update() {
      updateButtons();
      render();
    }

    function updateButtons() {
      const n = scenes.length;
      btnScenePrev.disabled = currentScene <= 0;
      btnSceneNext.disabled = currentScene >= n - 1;
      sceneInfo.textContent = n === 0 ? 'no data' : `Scene ${currentScene + 1} / ${n}`;

      const subCount = getSubPlanCount();
      const totalSteps = subCount + 1; // full plan + sub-plans
      btnStepPrev.disabled = currentStep <= 0;
      btnStepNext.disabled = currentStep >= totalSteps - 1;

      if (subCount === 0) {
        stepInfo.textContent = 'Full plan';
      } else if (currentStep === 0) {
        stepInfo.textContent = `Full plan (${subCount} steps)`;
      } else {
        stepInfo.textContent = `Step ${currentStep} / ${subCount}`;
      }
    }

    btnScenePrev.addEventListener('click', () => {
      if (currentScene > 0) { currentScene--; currentStep = 0; update(); }
    });
    btnSceneNext.addEventListener('click', () => {
      if (currentScene < scenes.length - 1) { currentScene++; currentStep = 0; update(); }
    });
    btnStepPrev.addEventListener('click', () => {
      if (currentStep > 0) { currentStep--; update(); }
    });
    btnStepNext.addEventListener('click', () => {
      if (currentStep < getSubPlanCount()) { currentStep++; update(); }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') btnStepPrev.click();
      if (e.key === 'ArrowRight') btnStepNext.click();
      if (e.key === 'ArrowUp') btnScenePrev.click();
      if (e.key === 'ArrowDown') btnSceneNext.click();
    });

    function render() {
      const plan = getCurrentPlan();
      if (!plan) {
        ctx.fillStyle = '#222';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#aaa';
        ctx.font = '16px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Load a JSON file to visualize', canvas.width/2, canvas.height/2);
        return;
      }

      const { nodes, edges } = plan;

      // Build adjacency
      const children = {};
      const parents = {};
      const nodeMap = {};
      for (const n of nodes) {
        nodeMap[n.id] = n;
        children[n.id] = [];
        parents[n.id] = [];
      }
      for (const e of edges) {
        children[e.from].push(e.to);
        parents[e.to].push(e.from);
      }

      // Roots
      const roots = nodes.filter(n => parents[n.id].length === 0).map(n => n.id);

      // Layers via BFS longest path
      const layer = {};
      const queue = [...roots];
      for (const r of roots) layer[r] = 0;
      while (queue.length) {
        const u = queue.shift();
        for (const v of children[u]) {
          const newLayer = layer[u] + 1;
          if (layer[v] === undefined || newLayer > layer[v]) {
            layer[v] = newLayer;
            queue.push(v);
          }
        }
      }

      // Group by layer
      const layers = {};
      let maxLayer = 0;
      for (const n of nodes) {
        const l = layer[n.id] || 0;
        if (!layers[l]) layers[l] = [];
        layers[l].push(n.id);
        maxLayer = Math.max(maxLayer, l);
      }

      // Position nodes
      const pos = {};
      for (let l = 0; l <= maxLayer; l++) {
        const layerNodes = layers[l] || [];
        if (l > 0) {
          layerNodes.sort((a, b) => {
            const avgA = parents[a].reduce((s, p) => s + (pos[p]?.x || 0), 0) / (parents[a].length || 1);
            const avgB = parents[b].reduce((s, p) => s + (pos[p]?.x || 0), 0) / (parents[b].length || 1);
            return avgA - avgB;
          });
        }
        for (let i = 0; i < layerNodes.length; i++) {
          pos[layerNodes[i]] = { x: i, y: l };
        }
      }

      // Center each layer
      for (let l = 0; l <= maxLayer; l++) {
        const layerNodes = layers[l] || [];
        const offset = (layerNodes.length - 1) / 2;
        for (const nid of layerNodes) pos[nid].x -= offset;
      }

      // Pixel coords
      const totalHeight = (maxLayer + 1) * LAYER_HEIGHT + 80;
      const maxWidth = Math.max(...Object.values(layers).map(l => l.length));
      const totalWidth = Math.max(maxWidth * MIN_NODE_SPACING + 80, 400);

      canvas.width = Math.max(totalWidth, 900);
      canvas.height = Math.max(totalHeight, 300);
      const centerX = canvas.width / 2;
      const topY = 50;

      const pixelPos = {};
      for (const nid of Object.keys(pos)) {
        pixelPos[nid] = {
          x: centerX + pos[nid].x * MIN_NODE_SPACING,
          y: topY + pos[nid].y * LAYER_HEIGHT,
        };
      }

      // Clear
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Title for sub-plan steps
      if (currentStep > 0) {
        ctx.font = 'bold 13px monospace';
        ctx.fillStyle = '#888';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(`Sub-plan ${currentStep} of ${getSubPlanCount()}`, canvas.width / 2, 10);
      }

      // Draw edges
      for (const e of edges) {
        const from = pixelPos[e.from];
        const to = pixelPos[e.to];
        if (!from || !to) continue;

        ctx.beginPath();
        ctx.moveTo(from.x, from.y + NODE_RADIUS);
        ctx.lineTo(to.x, to.y - NODE_RADIUS);

        if (e.status === 'fixed') {
          ctx.strokeStyle = '#ccc';
          ctx.lineWidth = 2;
          ctx.setLineDash([]);
        } else {
          ctx.strokeStyle = '#666';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 4]);
        }
        ctx.stroke();
        ctx.setLineDash([]);

        // Arrow head
        const angle = Math.atan2(to.y - NODE_RADIUS - (from.y + NODE_RADIUS), to.x - from.x);
        const arrowSize = 8;
        ctx.beginPath();
        ctx.moveTo(to.x, to.y - NODE_RADIUS);
        ctx.lineTo(to.x - arrowSize * Math.cos(angle - 0.4), to.y - NODE_RADIUS - arrowSize * Math.sin(angle - 0.4));
        ctx.moveTo(to.x, to.y - NODE_RADIUS);
        ctx.lineTo(to.x - arrowSize * Math.cos(angle + 0.4), to.y - NODE_RADIUS - arrowSize * Math.sin(angle + 0.4));
        ctx.strokeStyle = e.status === 'fixed' ? '#ccc' : '#666';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Cost label
        if (e.cost != null) {
          const mx = (from.x + to.x) / 2 + 12;
          const my = (from.y + NODE_RADIUS + to.y - NODE_RADIUS) / 2;
          ctx.font = 'bold 11px monospace';
          ctx.fillStyle = e.status === 'fixed' ? '#f1c40f' : '#888';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(`c=${e.cost}`, mx, my);
        }
      }

      // Draw nodes
      for (const n of nodes) {
        const p = pixelPos[n.id];
        if (!p) continue;
        const color = NODE_COLORS[n.type] || '#777';

        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, NODE_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, NODE_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = darken(color, 0.3);
        ctx.lineWidth = 2;
        ctx.stroke();

        // Label
        ctx.font = 'bold 11px monospace';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const typeLabel = {goal: 'GOAL', subgoal: 'SUB', bottleneck: 'BN', support: 'SUP', leaf: 'LEAF'}[n.type] || n.type;
        ctx.fillText(typeLabel, p.x, p.y - 8);

        // Details
        ctx.font = '10px monospace';
        ctx.fillStyle = '#ddd';
        const details = [];
        if (n.pos) details.push(`(${n.pos[0]},${n.pos[1]})`);
        if (n.robot) details.push(n.robot);
        if (details.length) ctx.fillText(details.join(' '), p.x, p.y + 7);
      }
    }

    function darken(color, amount) {
      const tmp = document.createElement('canvas');
      tmp.width = tmp.height = 1;
      const c = tmp.getContext('2d');
      c.fillStyle = color;
      c.fillRect(0, 0, 1, 1);
      const d = c.getImageData(0, 0, 1, 1).data;
      return `rgb(${Math.floor(d[0]*(1-amount))},${Math.floor(d[1]*(1-amount))},${Math.floor(d[2]*(1-amount))})`;
    }

    // Placeholder
    render();
  </script>
</body>
</html>
