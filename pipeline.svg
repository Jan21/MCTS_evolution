<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1150" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="1150" rx="12" fill="#fafafa" stroke="#ddd"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">Benchmark Pipeline</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#7f8c8d">python benchmark.py --n_val N --n_eval M</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- STEP 1: CLI Args -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="300" y="75" width="300" height="44" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="450" y="101" text-anchor="middle" font-weight="bold" fill="#2c3e50">Parse CLI args: n_val, n_eval</text>

  <!-- Arrow -->
  <line x1="450" y1="119" x2="450" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- STEP 2: run() -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="270" y="148" width="360" height="44" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="450" y="175" text-anchor="middle" font-weight="bold" fill="#2c3e50">run(algorithm, env_indices, n_val, n_eval)</text>

  <!-- Arrow -->
  <line x1="450" y1="192" x2="450" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- PHASE 1 BOX -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="60" y="222" width="780" height="390" rx="10" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="60" y="222" width="240" height="26" rx="6" fill="#3498db"/>
  <text x="80" y="240" font-size="13" font-weight="bold" fill="white">Phase 1: Validation (first n_val envs)</text>

  <!-- Load env -->
  <rect x="300" y="260" width="300" height="44" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="279" text-anchor="middle" font-size="12" fill="#7f8c8d">GridEnv.from_env(env_idx)</text>
  <text x="450" y="295" text-anchor="middle" font-weight="bold" fill="#2c3e50">Load environment -> (grid_env, state)</text>

  <!-- Arrow -->
  <line x1="450" y1="304" x2="450" y2="325" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Algorithm solve -->
  <rect x="300" y="328" width="300" height="44" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="450" y="347" text-anchor="middle" font-size="12" fill="#7f8c8d">algorithm.solve(grid_env, state)</text>
  <text x="450" y="363" text-anchor="middle" font-weight="bold" fill="#2c3e50">Algorithm produces PartialPlan</text>

  <!-- Arrow -->
  <line x1="450" y1="372" x2="450" y2="393" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Validate -->
  <rect x="300" y="396" width="300" height="44" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="450" y="415" text-anchor="middle" font-size="12" fill="#7f8c8d">validate(plan, grid_env, state)</text>
  <text x="450" y="431" text-anchor="middle" font-weight="bold" fill="#2c3e50">Run 10 validation checks</text>

  <!-- Diamond: passed? -->
  <polygon points="450,458 520,490 450,522 380,490" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="450" y="494" text-anchor="middle" font-weight="bold" font-size="12" fill="#2c3e50">passed?</text>

  <!-- FAIL path (left) -->
  <line x1="380" y1="490" x2="200" y2="490" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="290" y="483" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">NO</text>

  <rect x="90" y="470" width="115" height="40" rx="8" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="147" y="494" text-anchor="middle" font-weight="bold" font-size="12" fill="#c0392b">ABORT</text>
  <text x="147" y="508" text-anchor="middle" font-size="10" fill="#c0392b">return {}</text>

  <!-- PASS path (down) -->
  <line x1="450" y1="522" x2="450" y2="548" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="462" y="538" font-size="11" fill="#27ae60" font-weight="bold">YES</text>

  <!-- Evaluate -->
  <rect x="300" y="551" width="300" height="44" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="450" y="570" text-anchor="middle" font-size="12" fill="#7f8c8d">evaluate_plan(plan, grid_env)</text>
  <text x="450" y="586" text-anchor="middle" font-weight="bold" fill="#2c3e50">Compute metric (sum of edge costs)</text>

  <!-- Loop arrow (right side) -->
  <path d="M 600 575 Q 720 575 720 400 Q 720 280 600 280" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="735" y="420" font-size="11" fill="#3498db" font-weight="bold" transform="rotate(-90,735,420)">next env (i &lt; n_val)</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Arrow between phases -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <line x1="450" y1="612" x2="450" y2="640" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="632" font-size="11" fill="#27ae60" font-weight="bold">all n_val passed</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- PHASE 2 BOX -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="60" y="644" width="780" height="310" rx="10" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="60" y="644" width="310" height="26" rx="6" fill="#e67e22"/>
  <text x="80" y="662" font-size="13" font-weight="bold" fill="white">Phase 2: Evaluation (remaining n_eval - n_val envs)</text>

  <!-- Skip check -->
  <polygon points="450,685 530,712 450,739 370,712" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="450" y="709" text-anchor="middle" font-size="11" fill="#2c3e50">already in</text>
  <text x="450" y="721" text-anchor="middle" font-size="11" fill="#2c3e50">results?</text>

  <!-- Skip path (left) -->
  <line x1="370" y1="712" x2="250" y2="712" stroke="#95a5a6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="703" text-anchor="middle" font-size="11" fill="#95a5a6">YES</text>
  <rect x="160" y="696" width="90" height="32" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="205" y="716" text-anchor="middle" font-size="12" fill="#7f8c8d">skip</text>

  <!-- No path (down) -->
  <line x1="450" y1="739" x2="450" y2="760" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="755" font-size="11" fill="#555">NO</text>

  <!-- Load env -->
  <rect x="300" y="763" width="300" height="36" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="786" text-anchor="middle" font-weight="bold" fill="#2c3e50">Load environment</text>

  <!-- Arrow -->
  <line x1="450" y1="799" x2="450" y2="815" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Algorithm solve -->
  <rect x="300" y="818" width="300" height="36" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="450" y="841" text-anchor="middle" font-weight="bold" fill="#2c3e50">Algorithm produces PartialPlan</text>

  <!-- Arrow -->
  <line x1="450" y1="854" x2="450" y2="870" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Evaluate (no validate!) -->
  <rect x="300" y="873" width="300" height="36" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="450" y="896" text-anchor="middle" font-weight="bold" fill="#2c3e50">Evaluate (no validation)</text>

  <!-- Note: no validation -->
  <rect x="630" y="865" width="180" height="52" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1"/>
  <text x="720" y="884" text-anchor="middle" font-size="11" fill="#e67e22">Validation already</text>
  <text x="720" y="898" text-anchor="middle" font-size="11" fill="#e67e22">passed in Phase 1.</text>
  <text x="720" y="912" text-anchor="middle" font-size="11" fill="#e67e22">Skip for efficiency.</text>

  <!-- Loop arrow (right side) -->
  <path d="M 600 890 Q 790 890 790 790 Q 790 700 600 700" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="810" y="790" font-size="11" fill="#e67e22" font-weight="bold" transform="rotate(-90,810,790)">next env (i &lt; n_eval)</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Arrow to results -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <line x1="450" y1="954" x2="450" y2="980" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- RESULTS -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="200" y="983" width="500" height="52" rx="10" fill="#2c3e50" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="450" y="1005" text-anchor="middle" font-weight="bold" font-size="14" fill="white">Results: {env_idx: (plan, metric)}</text>
  <text x="450" y="1025" text-anchor="middle" font-size="12" fill="#bdc3c7">Print summary: solved/failed count, avg/min/max cost</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- METRIC DETAIL (bottom) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="60" y="1060" width="780" height="76" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="80" y="1080" font-weight="bold" font-size="12" fill="#2c3e50">Metric detail: evaluate_plan(plan, grid_env)</text>
  <text x="80" y="1098" font-size="11" fill="#555">For each physical edge, compute: shortest_path(start, end, support_pos)</text>
  <text x="80" y="1114" font-size="11" fill="#555">Case A: child=subgoal  ->  (bottleneck.pos, parent.pos, support.pos)</text>
  <text x="80" y="1130" font-size="11" fill="#555">Case B: parent=bottleneck  ->  (child.pos, bottleneck.pos, sibling_support.pos)     Case C: otherwise  ->  (child.pos, parent.pos, None)</text>
</svg>
